<script id="app-data" type="application/json">{"certifications":[{"id":"anthropic-introduction-to-model-context-protocol","name":"Introduction to Model Context Protocol","provider":"Anthropic","description":"Valide la compréhension des fondamentaux du Model Context Protocol (MCP), standard ouvert d'interconnexion entre modèles de langage et sources de données ou outils externes. Elle couvre l'architecture client/serveur, les notions de resources, tools et prompts, ainsi que la mise en œuvre d'un premier serveur MCP. Elle s'adresse aux développeurs souhaitant connecter des assistants IA à des systèmes d'entreprise.","difficulty":"Avancé","objective":{"quota":null,"obtenu":null,"enCours":null}},{"id":"anthropic-model-context-protocol-advanced-topics","name":"Model Context Protocol: Advanced Topics","provider":"Anthropic","description":"Valide la maîtrise avancée du Model Context Protocol : conception de serveurs MCP complexes, gestion des transports et de l'authentification, stratégies d'échantillonnage, sécurité et bonnes pratiques de déploiement en production. Elle s'adresse aux développeurs déjà familiers des bases du protocole souhaitant industrialiser leurs intégrations.","difficulty":"Avancé","objective":{"quota":null,"obtenu":null,"enCours":null}},{"id":"anthropic-architect-foundation","name":"Architect Foundation","provider":"Anthropic","description":"Valide les fondamentaux de la conception de solutions bâties sur les modèles Claude : choix de modèle, conception de prompts, architecture des systèmes agentiques, intégration via API et outils, ainsi que les bonnes pratiques d'évaluation, de sécurité et de mise en production. Elle s'adresse aux architectes et profils techniques concevant des applications d'IA générative en environnement entreprise.","difficulty":"Avancé","objective":{"quota":null,"obtenu":null,"enCours":null}},{"id":"autre-formation-m2-i","name":"Formation M2.I","provider":"Autre","description":"Formation dispensée par l'organisme M2i sur une thématique technique ou fonctionnelle spécifique, avec validation des acquis en fin de parcours. (Intitulé à préciser selon le module suivi.)","difficulty":"Avancé","objective":{"quota":null,"obtenu":null,"enCours":null}},{"id":"autre-dmbok","name":"DMBoK","provider":"Autre","description":"Atteste de la maîtrise du référentiel DAMA-DMBoK, corpus de référence de la gouvernance des données. Il couvre les onze domaines de connaissance de la discipline : gouvernance, architecture, modélisation, qualité, métadonnées, données de référence, sécurité, intégration, entreposage et BI. Il s'adresse aux profils data management souhaitant structurer leur pratique sur un socle méthodologique reconnu (certification CDMP associée).","difficulty":"Avancé","objective":{"quota":null,"obtenu":null,"enCours":null}},{"id":"autre-stanford-machine-learning-specialization-coursera","name":"Stanford Machine Learning Specialization (Coursera)","provider":"Autre","description":"Valide la maîtrise des fondamentaux du machine learning : régression et classification supervisées, réseaux de neurones, arbres de décision, apprentissage non supervisé, systèmes de recommandation et apprentissage par renforcement. Elle couvre également les bonnes pratiques de conception d'un modèle (biais/variance, jeux de validation). Elle s'adresse aux profils techniques souhaitant acquérir des bases solides et applicables en data science.","difficulty":"Avancé","objective":{"quota":null,"obtenu":null,"enCours":null}},{"id":"autre-itil-foundation","name":"ITIL Foundation","provider":"Autre","description":"Valide la compréhension du référentiel ITIL 4 de gestion des services IT : chaîne de valeur des services, principes directeurs, dimensions de la gestion des services et principales pratiques (gestion des incidents, des changements, des problèmes, des niveaux de service). Elle s'adresse à tout profil IT évoluant dans un contexte de production ou de service management.","difficulty":"Avancé","objective":{"quota":null,"obtenu":null,"enCours":null}},{"id":"aws-ai-practitioner-foundational","name":"AI Practitioner - Foundational","provider":"AWS","description":"La certification AWS Certified AI Practitioner valide les connaissances recherchées concernant les concepts et cas d’utilisation de l’intelligence artificielle (IA), du machine learning (ML) et de l’IA générative. Renforcez votre avantage concurrentiel et donnez-vous les moyens de faire avancer votre carrière et d’augmenter vos revenus.","difficulty":"Avancé","objective":{"quota":10,"obtenu":0,"enCours":null}},{"id":"aws-cloud-practitioner-foundational","name":"Cloud Practitioner - Foundational","provider":"AWS","description":"Le certificat AWS Certified Cloud Practitioner valide une compréhension fondamentale et de haut niveau des services et terminologie du Cloud AWS.  Il s'agit d'un bon point de départ dans le parcours AWS Certification pour les personnes n'ayant aucune expérience préalable en informatique ou en cloud qui se lancent dans une carrière dans ce domaine, ou pour les employés de l'entreprise qui cherchent à acquérir des connaissances de base sur le cloud.","difficulty":"Débutant","objective":{"quota":null,"obtenu":null,"enCours":null}},{"id":"aws-security-specialty","name":"Security - Specialty","provider":"AWS","description":"Valide l'expertise en sécurisation des workloads AWS : gestion des identités et des permissions (IAM), protection des données au repos et en transit, chiffrement et gestion des clés (KMS), sécurité réseau, détection des menaces et réponse à incident. Elle s'adresse aux profils sécurité ou architectes disposant de plusieurs années de pratique AWS en environnement de production.","difficulty":"Avancé","objective":{"quota":null,"obtenu":null,"enCours":null}},{"id":"aws-deeplearning-ai-data-engineering-specialization","name":"DeepLearning.AI Data Engineering Specialization","provider":"AWS","description":"La spécialisation AWS – DeepLearning.AI Data Engineering valide la capacité à concevoir, construire et opérer des systèmes de données bout en bout sur AWS, en partant des besoins métier pour aboutir à des architectures exploitables. Elle atteste de la maîtrise du cycle de vie de la donnée (ingestion batch et streaming, stockage, transformation, service aux consommateurs), du choix des services AWS adaptés à chaque étape (S3, Glue, Kinesis, Redshift, Athena, Lambda), ainsi que de la modélisation et de l'organisation des données en zones (raw, cleaned, curated). Elle couvre également les principes d'orchestration des pipelines, de qualité, de gouvernance et de sécurité des données, et de maîtrise des coûts.\n\nElle s'adresse aux profils data disposant de bases en SQL et en Python, souhaitant structurer leur pratique de l'ingénierie des données autour des bonnes pratiques AWS et adopter une posture orientée cas d'usage plutôt que purement technique.","difficulty":"Avancé","objective":{"quota":null,"obtenu":null,"enCours":null}},{"id":"aws-generative-ai-developer-professional","name":"Generative AI developer - Professional","provider":"AWS","description":"La certification AWS Certified Generative AI Developer – Professional valide les compétences avancées nécessaires pour concevoir, intégrer et déployer des applications d’IA générative prêtes pour la production sur AWS. Elle atteste de la maîtrise des fondations modèles, des architectures RAG, du prompt engineering, ainsi que de l’optimisation et de la gouvernance des solutions GenAI dans un environnement cloud sécurisé et scalable.","difficulty":"Avancé","objective":{"quota":null,"obtenu":null,"enCours":null}},{"id":"aws-solutions-architect-associate","name":"Solutions Architect - Associate","provider":"AWS","description":"AWS Certified Solutions Architect - Associate se concentre sur la conception de solutions optimisées en termes de coûts et de performances. Il s’agit d’un point de départ idéal pour les candidats possédant des connaissances du Cloud AWS ou une solide expérience de l’informatique sur site. Cet examen ne requiert pas d’expérience pratique approfondie en matière de code, bien que la connaissance des concepts de base de la programmation soit un avantage.","difficulty":"Avancé","objective":{"quota":2,"obtenu":0,"enCours":null}},{"id":"aws-solutions-architect-professional","name":"Solutions Architect - Professional","provider":"AWS","description":"Cette qualification permet à ses détenteurs de prouver leurs connaissances et compétences avancées en matière de résolutions de problèmes complexes à l'aide de solutions complexes, en matière d'optimisation de la sécurité, des coûts et des performances, ainsi qu'en matière d'automatisation de processus manuels. Cette certification permet aux organisations d'identifier et de faire progresser les talents possédant ces compétences essentielles à la mise en œuvre d'initiatives dans le cloud.","difficulty":"Avancé","objective":{"quota":null,"obtenu":null,"enCours":null}},{"id":"aws-data-engineer-associate","name":"Data Engineer - Associate","provider":"AWS","description":"Cette certification valide les compétences et les connaissances relatives aux principaux services AWS liés aux données, la capacité à ingérer et à transformer des données, à orchestrer des pipelines de données tout en appliquant des concepts de programmation, à concevoir des modèles de données, à gérer les cycles de vie des données et à garantir la qualité des données.","difficulty":"Avancé","objective":{"quota":5,"obtenu":0,"enCours":null}},{"id":"aws-machine-learning-engineer-associate","name":"Machine Learning Engineer - Associate","provider":"AWS","description":"La certification AWS Certified Machine Learning Engineer – Associate valide les compétences opérationnelles pour construire, entraîner, déployer et superviser des solutions de machine learning sur AWS. Elle confirme la maîtrise de la préparation des données, du développement de modèles, de leur mise en production via SageMaker et du monitoring continu des performances et de la sécurité.\nDestinée aux profils techniques avec une première expérience en ML ou en ingénierie cloud, elle constitue un levier pour prouver sa capacité à industrialiser des workflows ML fiables, scalables et alignés avec les bonnes pratiques MLOps.","difficulty":"Avancé","objective":{"quota":5,"obtenu":0,"enCours":null}},{"id":"aws-machine-learning-specialty","name":"Machine Learning - Specialty","provider":"AWS","description":"Ce titre de compétence permet aux organisations d'identifier et de développer les talents possédant les compétences essentielles à la mise en œuvre d'initiatives de cloud. Earning AWS Certified Machine Learning – Specialty valide l'expertise en création, entraînement, réglage et déploiement de modèles de machine learning (ML) sur AWS.","difficulty":"Avancé","objective":{"quota":null,"obtenu":null,"enCours":null}},{"id":"azure-administrator-associate","name":"Administrator Associate","provider":"Azure","description":"Valide la capacité à administrer un environnement Microsoft Azure au quotidien : gestion des identités et des accès (Entra ID), gouvernance et abonnements, stockage, machines virtuelles, réseaux virtuels et supervision. Elle s'adresse aux administrateurs systèmes et cloud disposant d'une expérience opérationnelle sur Azure et souhaitant attester de leur autonomie sur l'exploitation d'un tenant.","difficulty":"Avancé","objective":{"quota":null,"obtenu":null,"enCours":null}},{"id":"azure-ai-fundamentals","name":"AI Fundamentals","provider":"Azure","description":"Cette certification est pour vous l’occasion de montrer que vous connaissez les concepts d’apprentissage automatique et d’IA, et les services Microsoft Azure associés. En tant que candidat à cette certification, vous devez connaître les supports de formation auto-rythmée ou dirigée par un instructeur. Si vous avez une expérience à la fois technique et non technique, cette certification est pour vous. Aucune expérience en science des données et en génie logiciel n’est requise.","difficulty":"Débutant","objective":{"quota":10,"obtenu":1,"enCours":null}},{"id":"azure-azure-fundamentals","name":"Azure Fundamentals","provider":"Azure","description":"Démontrer les connaissances de base sur les concepts du cloud, les services Azure de base, ainsi que les fonctionnalités et outils de gestion et de gouvernance d’Azure. En tant que candidat à cette certification, vous travaillez dans l’informatique et vous souhaitez montrer que vous connaissez les concepts du cloud en général et de Microsoft Azure en particulier. Cette certification est un point de départ courant en vue d’une carrière axée sur Azure.","difficulty":"Débutant","objective":{"quota":null,"obtenu":null,"enCours":null}},{"id":"azure-azure-data-fundamentals","name":"Azure Data Fundamentals","provider":"Azure","description":"La certification Azure Data Fundamentals valide la compréhension des concepts essentiels liés aux données dans Azure : modèles de données relationnels et non relationnels, principes d’analyse de données, et services Azure associés (Azure SQL, Cosmos DB, Synapse, etc.). Elle atteste de la capacité à identifier les solutions data adaptées, comprendre les workflows d’ingestion et de stockage, et appréhender les bases de l’analytics et de l’IA dans un environnement cloud.\nElle s’adresse aux débutants dans la data ou aux professionnels souhaitant poser des fondations solides avant d’évoluer vers des rôles d’ingénierie, d’analytics ou de science des données dans Azure.","difficulty":"Débutant","objective":{"quota":null,"obtenu":null,"enCours":null}},{"id":"azure-ai-engineer-associate","name":"AI Engineer Associate","provider":"Azure","description":"Cette certification certifie la capacité de créer, gérer et déployer des solutions IA qui tirent profit d’Azure AI. Les responsabilités de l'ingenieur Microsoft AI incluent la participation à toutes les phases du développement de solutions IA, notamment la définition et conception des exigences, le développement, le déploiement, l'intégration, la maintenance, le réglage des performances et la surveillance.","difficulty":"Avancé","objective":{"quota":null,"obtenu":null,"enCours":null}},{"id":"azure-ai-operationalize-machine-learning-and-generative-ai-solutions","name":"AI Operationalize machine learning and generative AI solutions","provider":"Azure","description":"La formation AI‑300 prépare à concevoir, implémenter et opérer des solutions MLOps et GenAIOps de bout en bout sur Azure. Elle couvre la mise en place d’infrastructures IA sécurisées et scalables, la gestion du cycle de vie complet des modèles (entraînement, déploiement, monitoring), ainsi que l’industrialisation d’applications d’IA générative et d’agents avec Microsoft Foundry. Les apprenants acquièrent une pratique concrète de l’automatisation, du CI/CD, de l’IaC et de l’observabilité via GitHub Actions, Azure CLI et Bicep.\nElle s’adresse aux data scientists, ML engineers et professionnels DevOps disposant de bases en Python, en machine learning et en pratiques CI/CD, souhaitant opérer des systèmes IA fiables, collaboratifs et prêts pour la production dans Azure.","difficulty":"Avancé","objective":{"quota":null,"obtenu":null,"enCours":null}},{"id":"azure-architect-technologies","name":"Architect Technologies","provider":"Azure","description":"Les candidats à cet examen doivent avoir des connaissances spécialisées dans la conception et la mise en œuvre de solutions exécutables sur Microsoft Azure, comprenant les aspects de calcul, de réseau, de stockage et de sécurité. Les candidats doivent avoir des compétences de niveau intermédiaire pour l’administration d’Azure. Les candidats doivent comprendre le développement Azure et les processus DevOps.","difficulty":"Avancé","objective":{"quota":null,"obtenu":null,"enCours":null}},{"id":"azure-solutions-architect-expert","name":"Solutions Architect Expert","provider":"Azure","description":"En tant qu’architecte de solutions Microsoft Azure, vous disposez d’une expertise dans la conception de solutions cloud et hybrides qui s’exécutent sur Azure. Vos responsabilités dans ce rôle consistent à conseiller les parties prenantes et à traduire les besoins métier en conceptions de solutions Azure alignées sur Azure Well-Architected Framework et Cloud Adoption Framework pour Azure. Dans ce rôle, vous implémentez des solutions sur Azure en vous associant à d’autres professionnels.","difficulty":"Avancé","objective":{"quota":5,"obtenu":0,"enCours":null}},{"id":"azure-data-scientist-associate","name":"Data Scientist Associate","provider":"Azure","description":"Gérer l’ingestion et la préparation des données, l’entraînement et le déploiement des modèles, ainsi que la surveillance des solutions d’apprentissage automatique avec Python, Azure Machine Learning et MLflow. En tant que candidat à cette certification, vous devez avoir une expertise technique dans la mise en application de la science des données et du Machine Learning pour implémenter et exécuter des charges de travail de Machine Learning dans Azure. En outre, vous devez maîtriser l’optimisation des modèles de langage pour les applications d’IA à l’aide d’Azure AI.","difficulty":"Avancé","objective":{"quota":null,"obtenu":null,"enCours":null}},{"id":"azure-data-engineer-associate","name":"Data Engineer Associate","provider":"Azure","description":"La certification DP‑203 valide votre capacité à concevoir et mettre en œuvre des solutions de traitement de données sur Azure. Elle atteste de compétences en ingestion, transformation, stockage et optimisation des données à l’aide de services tels qu’Azure Synapse Analytics, Azure Data Factory, Azure Databricks ou Azure Data Lake.\nEn tant que candidat à cette certification, vous devez comprendre comment construire des pipelines fiables, sécurisés et scalables pour soutenir des analyses avancées et des solutions d’IA. Cette certification s’adresse aux professionnels souhaitant démontrer leur expertise en ingénierie des données dans Azure et occuper des rôles clés dans la modernisation des plateformes data.","difficulty":"Avancé","objective":{"quota":null,"obtenu":null,"enCours":null}},{"id":"azure-fabric-analytics-engineer-associate","name":"Fabric Analytics Engineer Associate","provider":"Azure","description":"La certification DP‑600 valide votre capacité à créer, gérer et déployer des solutions analytiques de bout en bout avec Microsoft Fabric. Elle couvre la préparation des données, l’ingestion, la modélisation sémantique, l’optimisation des performances et la gouvernance des solutions analytiques.\nEn tant que candidat à cette certification, vous devez maîtriser l’environnement Fabric et ses workloads (Data Factory, Data Engineering, Data Warehouse, Power BI). Cette certification cible les ingénieurs data et professionnels de l’analytic souhaitant démontrer leur expertise dans la conception de solutions unifiées, performantes et gouvernées sur Fabric.","difficulty":"Avancé","objective":{"quota":5,"obtenu":0,"enCours":null}},{"id":"azure-fabric-data-engineer-associate","name":"Fabric Data Engineer Associate","provider":"Azure","description":"La certification Fabric Data Engineer Associate valide la capacité à concevoir, construire et optimiser des solutions data de bout en bout dans Microsoft Fabric. Elle atteste de la maîtrise de l’ingestion, de la transformation et du modelling des données, de la gestion des pipelines, ainsi que de l’orchestration et de la gouvernance au sein d’un environnement unifié Fabric (Lakehouse, Data Engineering, Data Factory, Data Warehouse, Power BI).\nElle s’adresse aux data engineers souhaitant démontrer leur expertise dans la création de plateformes analytiques robustes, scalables et sécurisées, prêtes pour la production et alignées sur les bonnes pratiques de Fabric.","difficulty":"Avancé","objective":{"quota":5,"obtenu":0,"enCours":null}},{"id":"azure-azure-databricks-data-engineer-associate","name":"Azure Databricks Data Engineer Associate","provider":"Azure","description":"La certification DP‑750 valide l’expertise nécessaire pour concevoir, implémenter et opérer des solutions d’ingénierie des données sur Azure Databricks. Elle atteste de la capacité à intégrer et modéliser des données, construire et déployer des pipelines optimisés, appliquer les meilleures pratiques de qualité et gouvernance dans Unity Catalog, et maintenir des workloads data en production.\nElle s’adresse aux professionnels maîtrisant SQL, Python, le SDLC (dont Git), et familiers avec Microsoft Entra, Azure Data Factory et Azure Monitor. Dans ce rôle, vous configurez l’environnement Azure Databricks, sécurisez Unity Catalog, préparez et transformez les données, et travaillez étroitement avec architectes, administrateurs, data scientists et analysts pour livrer des solutions data robustes et sécurisées sur Azure.","difficulty":"Avancé","objective":{"quota":null,"obtenu":null,"enCours":null}},{"id":"collibra-data-quality-steward","name":"Data Quality Steward","provider":"Collibra","description":"La certification Collibra Data Quality Steward valide l’expertise dans la surveillance, l’analyse et l’amélioration continue de la qualité des données à l’aide de Collibra Data Quality &amp; Observability. Elle atteste de la capacité à détecter, prioriser et remédier aux problèmes de qualité, à définir et appliquer des règles (automatiques ou custom), à mettre en place du profiling et du monitoring, et à assurer la conformité aux politiques et réglementations (GDPR, CCPA, HIPAA).\nElle s’adresse aux professionnels responsables de la fiabilité des données – en charge de superviser datasets et pipelines, d’évaluer les anomalies, d’orchestrer la gouvernance et le cycle de vie des données, et d’opérer des workflows de remédiation en collaboration avec les équipes métier et techniques.","difficulty":"Avancé","objective":{"quota":null,"obtenu":null,"enCours":null}},{"id":"databricks-associate-developer-for-apache-spark","name":"Associate Developer for Apache Spark","provider":"Databricks","description":"La certification Apache Spark Developer Associate valide les compétences fondamentales pour développer des applications distribuées avec Spark sur Databricks. Elle atteste de la maîtrise des API DataFrame, de Spark SQL, des opérations courantes de manipulation de données, ainsi que des bases de l’architecture Spark, du streaming et des bonnes pratiques de performance.\nElle s’adresse aux professionnels souhaitant démontrer leur capacité à utiliser Spark pour transformer, analyser et traiter des données à grande échelle au sein de la plateforme Lakehouse.","difficulty":"Avancé","objective":{"quota":null,"obtenu":null,"enCours":null}},{"id":"databricks-data-analyst-associate","name":"Data Analyst Associate","provider":"Databricks","description":"La certification Databricks Data Analyst Associate valide la capacité à analyser et transformer des données sur la plateforme Lakehouse. Elle atteste de la maîtrise de SQL et des fonctionnalités du workspace Databricks pour explorer, préparer, visualiser et interroger les données dans un environnement unifié. Elle s’adresse aux professionnels souhaitant démontrer leur aptitude à exploiter Databricks pour produire des analyses fiables et optimiser la prise de décision.","difficulty":"Avancé","objective":{"quota":null,"obtenu":null,"enCours":null}},{"id":"databricks-fundamentals-accreditation","name":"Fundamentals (accreditation)","provider":"Databricks","description":"Valide la compréhension des concepts fondamentaux de la Databricks Data Intelligence Platform : architecture lakehouse, Delta Lake, Unity Catalog et principaux cas d'usage data engineering, data warehousing et data science. Accréditation d'entrée de gamme, sans prérequis technique fort.","difficulty":"Avancé","objective":{"quota":null,"obtenu":null,"enCours":null}},{"id":"databricks-ai-fundamentals-accreditation","name":"AI Fundamentals (accreditation)","provider":"Databricks","description":"Valide la compréhension des capacités d'IA et de machine learning de la plateforme Databricks : cycle de vie des modèles avec MLflow, IA générative, RAG et fine-tuning, ainsi que les principes de gouvernance associés. Accréditation d'introduction destinée aux profils techniques comme fonctionnels.","difficulty":"Avancé","objective":{"quota":null,"obtenu":null,"enCours":null}},{"id":"databricks-data-engineer-associate","name":"Data Engineer Associate","provider":"Databricks","description":"La certification Databricks Data Engineer Associate valide les compétences essentielles pour réaliser des tâches d’ingénierie des données sur la plateforme Lakehouse. Elle couvre la compréhension du Databricks Data Intelligence Platform, l’ingestion et la transformation de données avec Spark SQL ou PySpark, ainsi que la mise en production et l’orchestration de pipelines via les workflows Databricks.\nElle s’adresse aux professionnels débutant sur Databricks et souhaitant démontrer leur capacité à construire et optimiser des pipelines de données fiables et gouvernés au sein de l’écosystème Databricks.","difficulty":"Avancé","objective":{"quota":20,"obtenu":0,"enCours":null}},{"id":"databricks-data-engineer-professional","name":"Data Engineer Professional","provider":"Databricks","description":"La certification Databricks Data Engineer Professional valide une expertise avancée dans la conception, l’orchestration et l’optimisation de pipelines de données à grande échelle sur la plateforme Lakehouse. Elle atteste de la capacité à gérer des workloads complexes, à appliquer les bonnes pratiques de performance et de gouvernance, et à maîtriser des outils tels que Delta Lake, Spark SQL/PySpark, Lakeflow Declarative Pipelines et Unity Catalog.\nElle s’adresse aux ingénieurs data expérimentés souhaitant démontrer leur aptitude à construire des solutions data robustes, scalables et prêtes pour la production dans l’écosystème Databricks.","difficulty":"Avancé","objective":{"quota":5,"obtenu":0,"enCours":null}},{"id":"databricks-generative-ai-engineer-associate","name":"Generative AI Engineer Associate","provider":"Databricks","description":"La certification Databricks Generative AI Engineer Associate valide les compétences essentielles pour concevoir et déployer des applications d’IA générative sur la plateforme Lakehouse. Elle atteste de la capacité à intégrer des modèles fondamentaux (FMs), à construire des pipelines RAG, à utiliser Vector Search et Model Serving, ainsi qu’à gérer l’ensemble du cycle de vie des solutions GenAI avec MLflow et Unity Catalog.\nElle s’adresse aux professionnels souhaitant démontrer leur aptitude à développer des applications GenAI fiables, performantes et bien gouvernées dans l’écosystème Databricks.","difficulty":"Avancé","objective":{"quota":5,"obtenu":0,"enCours":null}},{"id":"databricks-machine-learning-associate","name":"Machine Learning Associate","provider":"Databricks","description":"La certification Databricks Machine Learning Associate valide les compétences fondamentales nécessaires pour développer, entraîner et déployer des modèles de Machine Learning sur la plateforme Lakehouse. Elle atteste de la maîtrise des workflows ML avec Databricks, incluant la préparation des données, l’utilisation de MLflow, la sélection et l’évaluation de modèles, ainsi que l’industrialisation de solutions sur l’écosystème Databricks.\nElle s’adresse aux professionnels débutant en ingénierie ou science des données sur Databricks et souhaitant démontrer leur capacité à appliquer efficacement le Machine Learning dans un environnement unifié, collaboratif et orienté production.","difficulty":"Avancé","objective":{"quota":20,"obtenu":0,"enCours":null}},{"id":"databricks-machine-learning-professional","name":"Machine Learning Professional","provider":"Databricks","description":"La certification Databricks Machine Learning Professional valide une expertise avancée dans la conception, l&#39;entraînement, l’optimisation et le déploiement de solutions de Machine Learning et de Deep Learning sur la plateforme Lakehouse. Elle atteste de la maîtrise des workflows ML complexes, de la gestion de modèles à grande échelle avec MLflow, de la préparation avancée des données, ainsi que des bonnes pratiques de performance, de gouvernance et de mise en production dans Databricks.\nElle s’adresse aux ingénieurs ML expérimentés souhaitant démontrer leur capacité à construire des pipelines robustes, industrialiser des modèles et exploiter pleinement l’écosystème Databricks pour des solutions ML de niveau entreprise.","difficulty":"Avancé","objective":{"quota":5,"obtenu":0,"enCours":null}},{"id":"dataiku-core-designer","name":"Core Designer","provider":"Dataiku","description":"La certification Dataiku Core Designer valide les compétences fondamentales pour créer et gérer des projets dans Dataiku. Elle atteste de la capacité à naviguer dans la plateforme, explorer des données, construire des workflows no‑code via les recettes visuelles, préparer et transformer des datasets, et appliquer les bonnes pratiques de collaboration à l’aide de tableaux de bord et outils intégrés.\nElle s’adresse aux analystes, profils métier et débutants en data souhaitant démontrer leur maîtrise des fonctionnalités essentielles de Dataiku et poser les bases de projets data structurés et collaboratifs.","difficulty":"Débutant","objective":{"quota":null,"obtenu":null,"enCours":null}},{"id":"dataiku-advanced-designer","name":"Advanced Designer","provider":"Dataiku","description":"La certification Dataiku Advanced Designer valide la maîtrise des fonctionnalités avancées de Dataiku, notamment l’optimisation des flows avec les variables, la construction de pipelines performants, la gestion de la qualité des données via métriques et checks, ainsi que l’automatisation des workflows grâce aux scénarios.\nElle s’adresse aux utilisateurs expérimentés — data analysts, data engineers ou power users — souhaitant démontrer leur capacité à concevoir, industrialiser et optimiser des pipelines complexes dans Dataiku.","difficulty":"Avancé","objective":{"quota":null,"obtenu":null,"enCours":null}},{"id":"dataiku-developer","name":"Developer","provider":"Dataiku","description":"La certification Dataiku Developer valide la capacité à étendre Dataiku grâce au développement avancé : création de plugins, utilisation de code (Python, R), gestion du versioning, interaction avec les APIs et industrialisation de composants réutilisables. Elle atteste de la maîtrise des fonctionnalités de développement permettant d’enrichir la plateforme et de construire des solutions data plus flexibles et personnalisées.\nElle s’adresse aux utilisateurs techniques souhaitant démontrer leur aptitude à développer, intégrer et déployer des éléments personnalisés dans Dataiku.","difficulty":"Avancé","objective":{"quota":null,"obtenu":null,"enCours":null}},{"id":"dataiku-generative-ai-practitioner","name":"Generative AI Practitioner","provider":"Dataiku","description":"La certification Dataiku GenAI Practitioner valide la capacité à utiliser les outils visuels de Dataiku pour exploiter des modèles de langage (LLMs). Elle atteste de la maîtrise des recettes LLM, du prompt engineering, du traitement de texte avancé, ainsi que de la mise en place de solutions RAG (Retrieval‑Augmented Generation) au sein de Dataiku.\nElle s’adresse aux professionnels souhaitant démontrer leur aptitude à intégrer l’IA générative dans des workflows Dataiku et à construire des applications basées sur les LLMs en environnement opérationnel.","difficulty":"Avancé","objective":{"quota":null,"obtenu":null,"enCours":null}},{"id":"dataiku-ml-practitioner","name":"ML Practitioner","provider":"Dataiku","description":"La certification Dataiku ML Practitioner valide la capacité à construire, évaluer et déployer des modèles de machine learning en utilisant les outils visuels de Dataiku. Elle atteste de la maîtrise du Visual ML, de l’analyse statistique interactive, du tuning de modèles, ainsi que du déploiement et du scoring de modèles dans le Flow.\nElle s’adresse aux data scientists et analystes souhaitant démontrer leur aptitude à mener des projets ML de bout en bout dans Dataiku, sans nécessairement coder.","difficulty":"Avancé","objective":{"quota":null,"obtenu":null,"enCours":null}},{"id":"dataiku-mlops-practitioner","name":"MLOps Practitioner","provider":"Dataiku","description":"La certification Dataiku MLOps Practitioner valide la capacité à industrialiser, déployer et superviser des modèles dans Dataiku. Elle atteste de la maîtrise du cycle de vie complet des modèles : packaging, déploiement, gestion des versions, automatisation via scénarios, monitoring des performances et gouvernance des modèles en production.\nElle s’adresse aux data scientists, ML engineers et utilisateurs avancés souhaitant démontrer leur aptitude à opérer des pipelines ML robustes et fiables dans Dataiku.","difficulty":"Avancé","objective":{"quota":null,"obtenu":null,"enCours":null}},{"id":"google-cloud-platform-generative-ai-leader","name":"Generative AI Leader","provider":"Google Cloud Platform","description":"Les Generative AI Leaders sont des professionnels visionnaires qui possèdent une connaissance approfondie de la façon dont l&#39;IA générative peut transformer les entreprises. Ils connaissent les offres d&#39;IA générative de Google Cloud utiles à une entreprise et comprennent comment l&#39;approche de Google, qui place l&#39;IA au premier plan, peut aider les organisations à adopter l&#39;IA de façon innovante et responsable. Ils influencent les initiatives basées sur l&#39;IA générative et identifient des opportunités dans les différents secteurs d&#39;activité et fonctions métier, en utilisant les offres adaptées aux entreprises de Google Cloud pour accélérer l&#39;innovation.\nCette certification s&#39;adresse à toute personne, quel que soit son poste, avec ou sans expérience technique pratique.","difficulty":"Avancé","objective":{"quota":15,"obtenu":0,"enCours":null}},{"id":"google-cloud-platform-professional-cloud-devops-engineer","name":"Professional Cloud DevOps Engineer","provider":"Google Cloud Platform","description":"Valide la capacité à construire et opérer des systèmes fiables sur Google Cloud en appliquant les principes SRE : automatisation des pipelines CI/CD, gestion de l'infrastructure as code, définition des SLO/SLI, observabilité (logging, monitoring, tracing) et gestion des incidents. Elle s'adresse aux profils DevOps/SRE souhaitant démontrer leur maîtrise de l'équilibre entre vélocité de livraison et fiabilité de service.","difficulty":"Avancé","objective":{"quota":null,"obtenu":null,"enCours":null}},{"id":"google-cloud-platform-cloud-digital-leader","name":"Cloud Digital Leader","provider":"Google Cloud Platform","description":"Un Cloud Digital Leader est capable de présenter les fonctionnalités des principaux produits et services Google Cloud, ainsi que leurs avantages pour les entreprises. Il est également capable de décrire des cas d&#39;utilisation métier courants et d&#39;expliquer comment les solutions cloud aident les entreprises.\nCette certification s&#39;adresse à toute personne souhaitant démontrer sa maîtrise des principes de base du cloud computing, et la manière dont les produits et services Google Cloud peuvent être utilisés pour atteindre les objectifs d&#39;une entreprise.","difficulty":"Débutant","objective":{"quota":null,"obtenu":null,"enCours":null}},{"id":"google-cloud-platform-associate-data-practitioner","name":"Associate Data Practitioner","provider":"Google Cloud Platform","description":"La certification GCP Associate Data Practitioner valide les compétences essentielles pour préparer, ingérer, analyser et gérer des données dans Google Cloud. Elle atteste de la capacité à utiliser les services data de GCP — tels que BigQuery, Cloud Storage, Dataflow ou Looker — pour réaliser des tâches d’ingestion, de transformation, d’orchestration de pipelines et de visualisation de données.\nElle s’adresse aux professionnels débutants dans les workloads data cloud souhaitant démontrer leur maîtrise des bases du data engineering et de l’analytics sur GCP, avec une compréhension des concepts fondamentaux du cloud et au moins six mois d’expérience pratique recommandés.","difficulty":"Avancé","objective":{"quota":null,"obtenu":null,"enCours":null}},{"id":"google-cloud-platform-associate-cloud-engineer","name":"Associate Cloud Engineer","provider":"Google Cloud Platform","description":"Un Associate Cloud Engineer déploie et sécurise les applications, les services et l&#39;infrastructure, surveille les opérations de plusieurs projets, et gère les solutions d&#39;entreprise pour s&#39;assurer qu&#39;elles correspondent aux métriques de performances cibles.\nIl est expérimenté dans l&#39;utilisation des clouds publics et des solutions sur site. Il est capable d&#39;effectuer des tâches courantes basées sur la plate-forme pour gérer et évoluer une ou plusieurs solutions déployées, qui utilisent les services autogérés ou gérés par Google sur Google Cloud.","difficulty":"Avancé","objective":{"quota":null,"obtenu":null,"enCours":null}},{"id":"google-cloud-platform-professional-cloud-architect","name":"Professional Cloud Architect","provider":"Google Cloud Platform","description":"Les Architectes Cloud Professionnels permettent aux entreprises de tirer parti des technologies Google Cloud. Grâce à une connaissance approfondie de l'architecture cloud et de Google Cloud, ils conçoivent, développent et gèrent des solutions robustes, sécurisées, évolutives, hautement disponibles et dynamiques pour atteindre les objectifs commerciaux.","difficulty":"Avancé","objective":{"quota":5,"obtenu":0,"enCours":null}},{"id":"google-cloud-platform-professional-data-engineer","name":"Professional Data Engineer","provider":"Google Cloud Platform","description":"Un ingénieur de données professionnel rend les données utilisables et utiles pour les autres en collectant, transformant et publiant des données. Cette personne évalue et sélectionne les produits et services pour répondre aux exigences commerciales et réglementaires. Un ingénieur de données professionnel crée et gère des systèmes de traitement de données robustes. Cela inclut la capacité de concevoir, de créer, de déployer, de surveiller, de maintenir et de sécuriser les charges de travail de traitement des données.","difficulty":"Avancé","objective":{"quota":10,"obtenu":0,"enCours":null}},{"id":"google-cloud-platform-professional-machine-learning-engineer","name":"Professional Machine Learning Engineer","provider":"Google Cloud Platform","description":"L'examen Professional Machine Learning Engineer permet les compétences suivantes : Concevez des solutions d'IA nécessitant peu de code, Collaborez au sein des équipes et entre les équipes pour gérer les données et les modèles,Adaptez des prototypes à des modèles de ML, Diffusez et faites évoluer des modèles, Automatisez et orchestrez les pipelines de ML, Surveillez les solutions d'IA.","difficulty":"Avancé","objective":{"quota":10,"obtenu":0,"enCours":null}},{"id":"hugging-face-ai-agents-fundamentals","name":"AI Agents - Fundamentals","provider":"Hugging Face","description":"La certification AI Agents – Fundamentals valide la compréhension des principes essentiels des agents IA dans l’écosystème Hugging Face. Elle atteste de la capacité à expliquer le fonctionnement des agents, leurs composants, leurs capacités, ainsi que les notions clés de l’Agent Framework présentées dans la Unit 1 — Introduction to Agents.\nElle s’adresse aux débutants souhaitant acquérir les bases conceptuelles des agents IA Hugging Face, sans prérequis technique ni mise en pratique avancée.","difficulty":"Débutant","objective":{"quota":null,"obtenu":null,"enCours":null}},{"id":"hugging-face-mcp-course-fundamentals","name":"MCP Course - Fundamentals","provider":"Hugging Face","description":"La certification MCP Fundamentals valide la compréhension des principes essentiels du Model Context Protocol (MCP) et de son rôle dans l’interopérabilité entre modèles, outils et applications. Elle atteste de la capacité à expliquer le fonctionnement du protocole, ses composants, les mécanismes d’échange de contexte, ainsi que la manière dont les agents ou applications peuvent consommer ou exposer des capacités via MCP.\nElle s’adresse aux débutants souhaitant acquérir les bases conceptuelles du protocole MCP à travers l’unité fondamentale du cours, sans mise en pratique avancée.","difficulty":"Débutant","objective":{"quota":null,"obtenu":null,"enCours":null}},{"id":"hugging-face-ai-agents-completion","name":"AI Agents - Completion","provider":"Hugging Face","description":"La certification AI Agents – Completion valide la capacité à concevoir, configurer et implémenter un agent IA complet via l’Agent Framework Hugging Face. En plus des notions fondamentales, elle atteste de la maîtrise de la réalisation d’un use case concret et de la réussite du challenge final, incluant la création d’un agent opérationnel, l’intégration d’outils, la définition de comportements, et l’orchestration de flux LLM.\nElle s’adresse aux professionnels souhaitant démontrer leur aptitude à appliquer les concepts agents HF de façon pratique, créer des agents robustes et adaptés à des cas d’usage métiers, et structurer des workflows agentiques réutilisables.","difficulty":"Avancé","objective":{"quota":null,"obtenu":null,"enCours":null}},{"id":"hugging-face-mcp-course-completion","name":"MCP Course - Completion","provider":"Hugging Face","description":"La certification MCP Completion valide la capacité à utiliser concrètement le Model Context Protocol pour créer, connecter et orchestrer des outils, modèles et applications via MCP. Elle atteste non seulement de la compréhension des concepts fondamentaux, mais aussi de la réussite d’un use case pratique et du challenge final, incluant la configuration d’un serveur MCP, la définition de capacités, l&#39;interfaçage avec des LLMs, et la mise en place d’interactions fiables et extensibles.\nElle s’adresse aux praticiens souhaitant démontrer leur aptitude à bâtir des intégrations MCP réelles, à concevoir des outils interopérables et à exploiter l’écosystème Hugging Face pour créer des workflows compatibles avec le standard MCP.","difficulty":"Avancé","objective":{"quota":null,"obtenu":null,"enCours":null}},{"id":"ibm-build-your-own-chatbot","name":"Build Your Own Chatbot","provider":"IBM","description":"Formation d'initiation à la conception d'agents conversationnels avec IBM watsonx Assistant : création d'intentions et d'entités, définition des dialogues, intégration à des canaux externes et déploiement d'un chatbot fonctionnel. Elle s'adresse à un public débutant souhaitant comprendre les principes de l'IA conversationnelle sans prérequis de développement avancé.","difficulty":"Avancé","objective":{"quota":null,"obtenu":null,"enCours":null}},{"id":"ibm-pre-conference-watsonx-hackathon","name":"Pre-conference watsonx Hackathon","provider":"IBM","description":"Participation à un hackathon organisé par IBM autour de la plateforme watsonx, consistant à concevoir et prototyper en temps contraint une solution d'IA générative sur un cas d'usage métier. Il valorise la mise en pratique rapide des briques watsonx.ai et watsonx.data en équipe.","difficulty":"Avancé","objective":{"quota":null,"obtenu":null,"enCours":null}},{"id":"iec-62443-ic32e","name":"62443 IC32E","provider":"IEC","description":"Valide la compréhension du référentiel IEC 62443 appliqué à la cybersécurité des systèmes industriels (OT/ICS) : analyse de risque, découpage en zones et conduits, niveaux de sécurité (SL) et exigences applicables aux exploitants comme aux intégrateurs. Elle s'adresse aux profils cybersécurité ou automatisme intervenant sur des environnements industriels.","difficulty":"Avancé","objective":{"quota":null,"obtenu":null,"enCours":null}},{"id":"linux-foundation-certified-kubernetes-administrator-cka","name":"Certified Kubernetes Administrator (CKA)","provider":"Linux Foundation","description":"Valide la capacité à administrer un cluster Kubernetes en conditions réelles : installation et configuration, gestion des workloads et du scheduling, réseau et services, stockage persistant, gestion des accès (RBAC) et troubleshooting. Examen 100 % pratique en ligne de commande, destiné aux administrateurs et ingénieurs plateforme.","difficulty":"Avancé","objective":{"quota":null,"obtenu":null,"enCours":null}},{"id":"microsoft-ai-business-professional","name":"AI Business Professional","provider":"Microsoft","description":"La certification AB‑730 valide la capacité à utiliser Microsoft 365 Copilot et les outils de productivité générative pour améliorer le travail quotidien, produire du contenu, analyser des informations et optimiser les processus métier sans écrire de code.","difficulty":"Débutant","objective":{"quota":null,"obtenu":null,"enCours":null}},{"id":"microsoft-ai-transformation-leader","name":"AI Transformation Leader","provider":"Microsoft","description":"La certification AB‑731 valide la capacité à piloter la transformation IA d’une organisation : identifier les opportunités, définir une stratégie d’adoption, accompagner le changement, et assurer une mise en œuvre responsable de l’IA à l’aide de Microsoft 365 Copilot et Azure AI Services.","difficulty":"Débutant","objective":{"quota":5,"obtenu":0,"enCours":null}},{"id":"microsoft-microsoft-365-certified-copilot-and-agent-administration-fundamentals","name":"Microsoft 365 Certified: Copilot and Agent Administration Fundamentals","provider":"Microsoft","description":"La certification AB‑900 valide les connaissances essentielles sur Microsoft 365, la sécurité, l’identité et l’administration de Copilot et des agents dans un environnement Microsoft 365. Elle s’adresse aux professionnels débutant dans la gestion d’environnements Microsoft 365 enrichis par l’IA et souhaitant démontrer une maîtrise des bases de l’administration moderne.","difficulty":"Débutant","objective":{"quota":5,"obtenu":0,"enCours":null}},{"id":"microsoft-microsoft-365-administrator","name":"Microsoft 365 Administrator","provider":"Microsoft","description":"La certification MS‑102 valide l’expertise nécessaire pour administrer, sécuriser et gérer un environnement Microsoft 365 à l’échelle de l’entreprise. Elle atteste de la capacité à gérer les identités avec Microsoft Entra ID, administrer les services Microsoft 365 (Exchange, SharePoint, Teams), assurer la sécurité, la conformité et la protection des données, ainsi que piloter la gouvernance et les accès.\nElle s’adresse aux administrateurs expérimentés responsables de l’implémentation, de l’exploitation et de la sécurisation des environnements Microsoft 365, en collaboration avec les équipes sécurité et IT pour garantir des services fiables, conformes et performants.","difficulty":"Débutant","objective":{"quota":5,"obtenu":0,"enCours":null}},{"id":"microsoft-microsoft-365-fundamentals","name":"Microsoft 365 Fundamentals","provider":"Microsoft","description":"Montrez que vous avez compris que Microsoft 365 fournit des applications de productivité de pointe, des services cloud intelligents et une sécurité de classe mondiale. Cet examen vous convient si vous souhaitez valider vos connaissances de base des solutions cloud pour améliorer la productivité et la collaboration entre les collaborateurs sur site, à distance et hybrides. En tant que candidat, vous devez être en mesure de recommander des solutions Microsoft 365 qui répondent aux besoins informatiques courants de l’organisation.","difficulty":"Débutant","objective":{"quota":null,"obtenu":null,"enCours":null}},{"id":"microsoft-power-platform-fundamentals","name":"Power Platform Fundamentals","provider":"Microsoft","description":"Illustrez la valeur métier et les fonctionnalités de produit de Microsoft Power Platform, telles que Power Apps, les connexions de données avec Dataverse et Power Automate. En tant que candidat à cette certification, vous aspirez à comprendre comment les technologies Microsoft Power Platform peuvent être utilisées. La certification est destinée aux candidats qui cherchent à commencer leur parcours de création de solutions avec Microsoft Power Platform.","difficulty":"Débutant","objective":{"quota":null,"obtenu":null,"enCours":null}},{"id":"microsoft-agentic-ai-business-solutions-architect","name":"Agentic AI Business Solutions Architect","provider":"Microsoft","description":"La certification AB‑100 valide l’expertise dans la conception d’architectures métier pilotées par l’IA et les agents Microsoft. Elle atteste de la capacité à imaginer, structurer et livrer des solutions agentiques sécurisées, scalables et orchestrées, en s’appuyant sur Dynamics 365, Microsoft Power Platform, Microsoft Copilot Studio et les Foundry Tools/Models.\nElle s’adresse aux architectes expérimentés capables de transformer les processus métier grâce à l’IA, de définir une stratégie agentic‑first et de piloter l’innovation au sein d’organisations complexes.","difficulty":"Avancé","objective":{"quota":5,"obtenu":0,"enCours":null}},{"id":"microsoft-intelligent-application-builder-associate","name":"Intelligent Application Builder Associate","provider":"Microsoft","description":"La certification Azure Data Fundamentals valide la compréhension des concepts essentiels liés aux données dans Azure : modèles de données relationnels et non relationnels, principes d’analyse de données, et services Azure associés (Azure SQL, Cosmos DB, Synapse, etc.). Elle atteste de la capacité à identifier les solutions data adaptées, comprendre les workflows d’ingestion et de stockage, et appréhender les bases de l’analytics et de l’IA dans un environnement cloud.\nElle s’adresse aux débutants dans la data ou aux professionnels souhaitant poser des fondations solides avant d’évoluer vers des rôles d’ingénierie, d’analytics ou de science des données dans Azure.","difficulty":"Avancé","objective":{"quota":5,"obtenu":0,"enCours":null}},{"id":"microsoft-ai-agent-builder-associate","name":"AI Agent Builder Associate","provider":"Microsoft","description":"La formation AB‑620T00 valide la capacité à concevoir, développer et opérer des solutions d’agents IA prêtes pour la production à l’aide de Microsoft Copilot Studio. Elle couvre la création d’agents intégrés aux systèmes et données d’entreprise, l’orchestration de workflows avancés et multi‑agents, l’automatisation de scénarios complexes (human‑in‑the‑loop, computer‑use), ainsi que l’application des bonnes pratiques de sécurité, gouvernance et IA responsable à l’échelle de l’entreprise.\nElle s’adresse aux développeurs et builders avancés disposant d’une expérience avec Copilot Studio, de bonnes bases en IA générative et en API REST, souhaitant délivrer des solutions d’agents robustes, intégrées et exploitables en environnement enterprise","difficulty":"Avancé","objective":{"quota":5,"obtenu":0,"enCours":null}},{"id":"microsoft-create-agents-in-microsoft-copilot-studio","name":"Create agents in Microsoft Copilot Studio","provider":"Microsoft","description":"La certification Create Agents in Microsoft Copilot Studio valide la capacité à concevoir, configurer et déployer des agents conversationnels à l’aide de Microsoft Copilot Studio. Elle atteste de la maîtrise de la création d’agents, de la définition des topics, du pilotage des conversations, de l’intégration de données et d’actions, ainsi que de la personnalisation du comportement des agents pour répondre à des besoins métier concrets.\nElle s’adresse aux professionnels souhaitant démontrer leur aptitude à créer et opérer des agents IA métier, intégrés à l’écosystème Microsoft (Power Platform, Microsoft 365, Connectors), sans nécessiter de compétences avancées en développement.","difficulty":"Avancé","objective":{"quota":5,"obtenu":0,"enCours":null}},{"id":"microsoft-next-gen-productivity-copilot-agents-for-the-modern-enterprise","name":"Next Gen Productivity: Copilot + Agents for the Modern Enterprise","provider":"Microsoft","description":"La formation DW‑101 valide la compréhension des usages avancés de Microsoft Copilot et des agents pour améliorer la productivité au sein des organisations modernes. Elle couvre les scénarios de productivité nouvelle génération, l’intégration des agents dans les flux de travail existants et la valorisation de Copilot dans un contexte enterprise.\nElle s’adresse aux profils techniques souhaitant maîtriser les concepts clés de Copilot et des agents afin de soutenir la transformation des environnements de travail modernes et renforcer l’adoption de l’IA à l’échelle de l’entreprise.","difficulty":"Avancé","objective":{"quota":5,"obtenu":0,"enCours":null}},{"id":"microsoft-simplify-agent-development-with-copilot-studio","name":"Simplify Agent Development with Copilot Studio","provider":"Microsoft","description":"La formation DW‑102 valide la capacité à simplifier le développement d’agents à l’aide de Microsoft Copilot Studio. Elle couvre les principes de création, de configuration et d’extension d’agents, ainsi que l’utilisation de Copilot Studio pour concevoir des agents adaptés à des cas d’usage métier concrets.\nElle s’adresse aux profils techniques souhaitant développer et déployer rapidement des agents tout en s’appuyant sur les meilleures pratiques de développement et d’évaluation dans Copilot Studio.","difficulty":"Avancé","objective":{"quota":5,"obtenu":0,"enCours":null}},{"id":"microsoft-specialize-data-security-consultation-with-microsoft-purview-in-the-era-of-ai","name":"Specialize Data Security Consultation with Microsoft Purview in the Era of AI","provider":"Microsoft","description":"La formation DW‑103 valide l’expertise en sécurité et gouvernance des données dans un contexte d’IA à l’aide de Microsoft Purview. Elle couvre la consultation en sécurité des données, la protection de l’information et les enjeux de gouvernance liés à l’utilisation de Copilot et des technologies IA.\nElle s’adresse aux profils pré‑vente et sécurité data souhaitant se spécialiser dans l’accompagnement des clients autour des problématiques de conformité, de protection et de gouvernance des données à l’ère de l’IA.","difficulty":"Avancé","objective":{"quota":5,"obtenu":0,"enCours":null}},{"id":"microsoft-develop-pro-code-agents-with-copilot-studio","name":"Develop Pro-Code Agents with Copilot Studio","provider":"Microsoft","description":"La formation DW‑104 valide la capacité à concevoir et développer des agents pro‑code avec Microsoft Copilot Studio. Elle couvre le développement avancé d’agents, l’implémentation de logiques complexes et l’intégration d’agents personnalisés dans des environnements enterprise.\nElle s’adresse aux profils techniques et développeurs souhaitant créer des agents sur mesure, robustes et extensibles, en exploitant pleinement les capacités pro‑code de Copilot Studio.","difficulty":"Avancé","objective":{"quota":5,"obtenu":0,"enCours":null}},{"id":"microsoft-github-copilot","name":"GitHub Copilot","provider":"Microsoft","description":"Explorer les fondamentaux de GitHub Copilot et son potentiel pour améliorer la productivité et favoriser l’innovation, tant pour les développeurs individuels que pour les entreprises.","difficulty":"Avancé","objective":{"quota":null,"obtenu":null,"enCours":null}},{"id":"microsoft-power-platform-functional-consultant-associate","name":"Power Platform Functional Consultant Associate","provider":"Microsoft","description":"Illustrer l’utilisation des solutions Microsoft Power Platform pour simplifier, automatiser et renforcer les processus métier pour les organisations dans le rôle de consultants fonctionnels. En tant que candidat, vous implémentez la conception fournie par et en collaboration avec un architecte Solutions, ainsi que les standards, la personnalisation et les artefacts établis par les concepteurs d’expérience utilisateur. Vous implémentez des intégrations avec des applications et des services tiers. Vous générez la documentation de formation et vous facilitez la formation et l’habilitation.","difficulty":"Avancé","objective":{"quota":null,"obtenu":null,"enCours":null}},{"id":"microsoft-power-bi-data-analyst-associate","name":"Power BI Data Analyst Associate","provider":"Microsoft","description":"Démontrez des méthodes et les meilleures pratiques qui s’alignent sur les exigences métier et techniques pour la modélisation, la visualisation et l’analyse des données avec Microsoft Power BI. En tant que candidat à cette certification, vous fournissez des insights actionnables en utilisant les données disponibles et en appliquant votre expertise du domaine.","difficulty":"Avancé","objective":{"quota":20,"obtenu":0,"enCours":null}},{"id":"microsoft-power-platform-developer-associate","name":"Power Platform Developer Associate","provider":"Microsoft","description":"La certification PL‑400 atteste de la capacité à développer des solutions avancées sur Power Platform, incluant logique métier, automatisations, intégrations et composants personnalisés. Elle s’adresse aux développeurs maîtrisant les outils Power Platform et les langages nécessaires pour créer et étendre des applications professionnelles robustes.","difficulty":"Avancé","objective":{"quota":null,"obtenu":null,"enCours":null}},{"id":"microsoft-power-platform-solution-architect","name":"Power Platform Solution Architect","provider":"Microsoft","description":"En tant que candidat à cette certification, vous devez avoir une expérience de l’architecture de solutions dans les disciplines fonctionnelles et techniques de Microsoft Power Platform. Vous devez être en mesure de faciliter les décisions de conception basées sur les pratiques recommandées dans les domaines du développement, de la configuration, de l’intégration, de l’infrastructure, de la sécurité, des licences, du stockage et de la gestion des modifications.","difficulty":"Avancé","objective":{"quota":null,"obtenu":null,"enCours":null}},{"id":"palantir-foundry-aip-builder-foundations","name":"Foundry & AIP Builder Foundations","provider":"Palantir","description":"Valide la maîtrise des fondamentaux de la plateforme Palantir Foundry et de l'AIP : ingestion et transformation des données, construction de l'ontologie, création de pipelines et développement d'applications opérationnelles exploitant les briques d'IA. Elle s'adresse aux builders et profils data amenés à concevoir des cas d'usage bout en bout sur la plateforme.","difficulty":"Avancé","objective":{"quota":null,"obtenu":null,"enCours":null}},{"id":"palantir-foundry-data-engineer-associate","name":"Foundry Data Engineer Associate","provider":"Palantir","description":"La certification Foundry Data Engineering valide la capacité à développer, maintenir et valider des pipelines de données dans Foundry. Elle atteste de la maîtrise des outils clés de la suite Foundry, de leur bon usage selon les cas d’emploi, ainsi que de la compréhension des bonnes pratiques d’ingénierie (pipeline best practices), de l’ontologie Foundry et des implications sur les applications métiers en aval.\nElle s’adresse aux professionnels souhaitant démontrer leur expertise dans la création et la maintenance de pipelines fiables, dans l’intégration de sources de données variées, et dans la conception d’ontologies adaptées aux besoins métier. L’examen couvre notamment : le développement de pipelines, leur maintenance, la connexion et l’intégration des données, et la modélisation via l’ontologie Foundry.","difficulty":"Avancé","objective":{"quota":null,"obtenu":null,"enCours":null}},{"id":"salesforce-agentforce-specialist","name":"Agentforce Specialist","provider":"Salesforce","description":"La certification Agentforce Specialist valide la capacité à configurer, concevoir et gérer des agents IA au sein d’Agentforce. Elle atteste de la maîtrise de la création d’agents intelligents (topics, actions standard et custom), du prompt engineering via Prompt Builder, de l’intégration de données avec Agentforce Data Library et Data Cloud, ainsi que de la gestion du cycle de développement et du déploiement d’agents (tests, sandbox → production, monitoring).\nElle s’adresse aux professionnels maîtrisant la configuration de la plateforme Salesforce et souhaitant démontrer leur aptitude à aligner des agents IA sur des cas d’usage métier, personnaliser leurs interactions, assurer leur sécurité, et exploiter les capacités multi‑agents et l’Agent API pour optimiser les processus et améliorer l’efficacité opérationnelle.","difficulty":"Avancé","objective":{"quota":null,"obtenu":null,"enCours":null}},{"id":"scaled-agile-safe-po-pm","name":"SAFe PO/PM","provider":"Scaled Agile","description":"Valide la maîtrise du rôle de Product Owner / Product Manager dans le cadre SAFe : construction et priorisation du backlog, rédaction des features et user stories, participation au PI Planning et animation de la boucle de feedback avec les parties prenantes. Elle s'adresse aux profils produit intervenant au sein d'Agile Release Trains en organisation agile à l'échelle.","difficulty":"Avancé","objective":{"quota":null,"obtenu":null,"enCours":null}},{"id":"scaled-agile-safe-6-architect","name":"SAFe 6 Architect","provider":"Scaled Agile","description":"Valide la capacité à exercer le rôle d'architecte (System / Solution Architect) dans un contexte SAFe 6 : définition et communication de l'Architectural Runway, alignement des choix techniques avec la stratégie produit, arbitrage des Enabler epics et accompagnement des Agile Release Trains. Elle s'adresse aux architectes intervenant dans des organisations agiles à l'échelle.","difficulty":"Avancé","objective":{"quota":null,"obtenu":null,"enCours":null}},{"id":"snowflake-snowpro-core","name":"SnowPro Core","provider":"Snowflake","description":"La certification SnowPro Core valide la maîtrise des fondamentaux de la plateforme Snowflake et la capacité à concevoir, exploiter et administrer des solutions de données dans le Data Cloud. Elle atteste de la compréhension de l'architecture Snowflake (séparation stockage/compute, virtual warehouses, services cloud), des mécanismes de chargement et de déchargement des données, ainsi que de la gestion des objets de base de données, du partitionnement micro et du cache. Elle évalue également la maîtrise de la sécurité et de la gouvernance (rôles, RBAC, protection des données), du partage sécurisé de données, ainsi que des leviers de performance et d'optimisation des coûts.\n\nElle s'adresse à tout profil travaillant avec Snowflake — data engineers, analystes, administrateurs, architectes ou consultants — disposant d'au moins 6 mois de pratique de la plateforme, et constitue le prérequis aux certifications SnowPro Advanced.","difficulty":"Débutant","objective":{"quota":null,"obtenu":null,"enCours":null}},{"id":"snowflake-snowpro-data-engineer","name":"SnowPro Data Engineer","provider":"Snowflake","description":"La certification SnowPro Advanced: Data Engineer valide la capacité à concevoir, développer et optimiser des solutions d’ingénierie des données sur Snowflake. Elle atteste de la maîtrise de l’ingestion de données (Data Lakes, APIs, on‑premises), de leur transformation et réplication multi‑cloud, ainsi que de la construction de pipelines et flux quasi temps réel. Elle évalue également la capacité à concevoir des solutions compute scalables et à analyser des métriques de performance pour garantir des workloads fiables et efficaces.\nElle s’adresse aux data engineers disposant d’au moins 2 ans d’expérience en production, souhaitant démontrer leur expertise avancée dans la mise en œuvre de pipelines robustes, performants et alignés avec les bonnes pratiques Snowflake.","difficulty":"Avancé","objective":{"quota":null,"obtenu":null,"enCours":null}}],"providers":["AWS","Anthropic","Autre","Azure","Collibra","Databricks","Dataiku","Google Cloud Platform","Hugging Face","IBM","IEC","Linux Foundation","Microsoft","Palantir","Salesforce","Scaled Agile","Snowflake"]}</script>

html,body{margin:0;padding:0;}
body{
  font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  background: var(--surface-0);
  color: var(--text-primary);
  min-height:100vh;
}
button, input, select, textarea{ font-family: inherit; }
.app-shell{ max-width:1280px; margin:0 auto; padding: 0 24px 64px; }

/* ---------- header ---------- */
.topbar{
  position: sticky; top:0; z-index:20;
  background: var(--surface-0);
  border-bottom: 1px solid var(--border-strong);
  padding-top: 20px;
}
.topbar-inner{ max-width:1280px; margin:0 auto; padding: 0 24px 16px; }
.topbar-row{ display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap; }
.brand{ display:flex; align-items:center; gap:10px; }
.brand-mark{
  height:34px; width:auto; flex-shrink:0; display:block;
}
.brand-text h1{ font-size:16px; margin:0; font-weight:700; line-height:1.2;}
.brand-text p{ margin:0; font-size:12px; color:var(--text-muted); }
.top-actions{ display:flex; align-items:center; gap:8px; }
.btn{
  border:1px solid var(--border-strong); background:var(--surface-1); color:var(--text-primary);
  padding:9px 14px;border-radius:10px;font-size:13px;font-weight:600;cursor:pointer;
  display:inline-flex; align-items:center; gap:6px;
}
.btn:hover{ background:var(--surface-2); }
.btn-primary{ background:var(--accent); border-color:var(--accent); color:#fff; }
.btn-primary:hover{ filter:brightness(1.06); }
.btn-ghost{ border-color:transparent; background:transparent; }
.btn-ghost:hover{ background:var(--surface-2); }
.btn-sm{ padding:5px 10px; font-size:12px; border-radius:8px; }
.btn-danger-ghost{ color: var(--critical); border-color:transparent; background:transparent;}
.btn-danger-ghost:hover{ background: color-mix(in srgb, var(--critical) 12%, transparent); }

.mode-banner{
  margin-top:12px; padding:10px 14px; border-radius:10px; font-size:13px;
  display:flex; align-items:center; gap:8px; font-weight:600;
}
.mode-banner.edit{ background: color-mix(in srgb, var(--accent) 10%, transparent); color: var(--accent-dark); }
.mode-banner.frozen{ background: color-mix(in srgb, var(--warning) 16%, transparent); color:#8a5a00; }
:root[data-theme="dark"] .mode-banner.frozen, @media (prefers-color-scheme:dark){ .mode-banner.frozen{ color: var(--warning);} }

.tabs{ display:flex; gap:4px; margin-top:16px; border-bottom:1px solid var(--border-strong); }
.tab{
  padding:10px 6px; margin-bottom:-1px; border:none; background:none; cursor:pointer;
  font-size:14px; font-weight:600; color:var(--text-muted); border-bottom:2px solid transparent;
  display:flex; align-items:center; gap:8px;
}
.tab.active{ color:var(--text-primary); border-bottom-color: var(--accent); }
.tab:hover:not(.active){ color:var(--text-secondary); }

main{ padding-top:24px; }
.view{ display:none; }
.view.active{ display:block; animation: fadein .18s ease; }
@keyframes fadein{ from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:none;} }

h2.section-title{ font-size:15px; font-weight:700; margin: 0 0 12px; }
.section{ margin-bottom:32px; }
.card{
  background:var(--surface-1); border:1px solid var(--border); border-radius:var(--radius);
  box-shadow: var(--shadow);
}
.card-pad{ padding:20px; }

/* ---------- KPI tiles ---------- */
.kpi-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:12px; }
.kpi{ padding:16px 18px; }
.kpi-label{ font-size:12px; color:var(--text-muted); font-weight:600; text-transform:uppercase; letter-spacing:.02em;}
.kpi-value{ font-size:28px; font-weight:700; margin-top:6px; line-height:1.1; }
.kpi-sub{ font-size:12px; color:var(--text-secondary); margin-top:4px; }

/* ---------- dashboard chart ---------- */
.chart-toolbar{ display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; margin-bottom:14px;}
.segmented{ display:inline-flex; border:1px solid var(--border-strong); border-radius:10px; padding:2px; background:var(--surface-2); }
.segmented button{ border:none; background:none; padding:6px 12px; font-size:12px; font-weight:600; border-radius:8px; cursor:pointer; color:var(--text-secondary); }
.segmented button.active{ background:var(--surface-1); color:var(--text-primary); box-shadow: var(--shadow); }
.bars{ display:flex; align-items:flex-end; gap:10px; height:180px; padding-top:20px; }
.bar-col{ flex:1; display:flex; flex-direction:column; align-items:center; gap:8px; height:100%; justify-content:flex-end; }
.bar-count{ font-size:12px; font-weight:700; color:var(--text-secondary); }
.bar-rect{ width:100%; max-width:34px; border-radius:6px 6px 3px 3px; min-height:3px; transition: height .25s ease; }
.bar-label{ font-size:11px; color:var(--text-muted); font-weight:600; }

.two-col{ display:grid; grid-template-columns: 1.3fr 1fr; gap:20px; }
@media (max-width: 860px){ .two-col{ grid-template-columns:1fr; } }

.mini-list{ display:flex; flex-direction:column; gap:10px; }
.mini-row{ display:flex; align-items:center; gap:10px; font-size:13px; }
.mini-row .name{ flex:1; font-weight:600; }
.mini-track{ flex:1.4; height:8px; border-radius:4px; background:var(--surface-2); overflow:hidden; }
.mini-fill{ height:100%; border-radius:4px; }
.mini-val{ width:26px; text-align:right; font-weight:700; font-variant-numeric:tabular-nums; }
.empty-hint{ color:var(--text-muted); font-size:13px; font-style:italic; padding:8px 0; }

/* ---------- provider pills / filters ---------- */
.filter-row{ display:flex; gap:10px; align-items:center; margin-bottom:16px; flex-wrap:wrap; }
.search-input{
  flex:1; min-width:180px; padding:9px 12px; border-radius:10px; border:1px solid var(--border-strong);
  background:var(--surface-1); color:var(--text-primary); font-size:13px;
}
.select-input{
  padding:9px 12px; border-radius:10px; border:1px solid var(--border-strong);
  background:var(--surface-1); color:var(--text-primary); font-size:13px;
}
.pill-row{ display:flex; gap:6px; flex-wrap:wrap; }
.pill{
  padding:6px 12px 6px 6px; border-radius:999px; border:1px solid var(--border-strong); background:var(--surface-1);
  font-size:12px; font-weight:600; cursor:pointer; color:var(--text-secondary); white-space:nowrap;
  display:inline-flex; align-items:center; gap:7px;
}
.pill.active{ background:var(--text-primary); color:var(--surface-1); border-color:var(--text-primary); }

/* ---------- tables ---------- */
table.data-table{ width:100%; border-collapse:collapse; font-size:13px; }
.data-table thead th{
  text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:.03em; color:var(--text-muted);
  font-weight:700; padding:0 12px 10px; border-bottom:1px solid var(--border-strong); cursor:pointer; user-select:none;
  white-space:nowrap;
}
.data-table thead th:hover{ color:var(--text-secondary); }
.data-table tbody td{ padding:12px; border-bottom:1px solid var(--border); vertical-align:middle; }
.data-table tbody tr:hover{ background:var(--surface-2); }
.data-table tbody tr:last-child td{ border-bottom:none; }
.cell-provider{ display:flex; align-items:center; gap:8px; font-weight:700; }
.muted{ color:var(--text-muted); font-style:italic; }
.na{ color:var(--text-muted); }
.num{ font-variant-numeric:tabular-nums; text-align:right; }
.progress-cell{ display:flex; flex-direction:column; gap:4px; min-width:110px; }
.progress-track{ height:6px; background:var(--surface-2); border-radius:3px; overflow:hidden; }
.progress-fill{ height:100%; border-radius:3px; }
.progress-text{ font-size:11px; color:var(--text-secondary); font-variant-numeric:tabular-nums; }
.link-cell{ color:var(--accent); font-weight:700; cursor:pointer; background:none; border:none; padding:0; font-size:13px; text-align:left; }
.link-cell:hover{ text-decoration:underline; }
.diff-badge{ font-size:11px; font-weight:700; padding:3px 8px; border-radius:6px; background:var(--surface-2); color:var(--text-secondary); white-space:nowrap; }

/* ---------- priority picker ---------- */
.priority-picker{ display:inline-flex; gap:3px; }
.priority-dot{
  width:22px;height:22px;border-radius:6px;border:1px solid var(--border-strong);
  font-size:10px; font-weight:700; display:flex; align-items:center; justify-content:center;
  cursor:pointer; background:var(--surface-1); color:var(--text-secondary);
}
.priority-dot:hover{ transform: translateY(-1px); }
.priority-dot.active{ border-color: transparent; }
.priority-picker.readonly .priority-dot{ cursor:default; }
.priority-picker.readonly .priority-dot:hover{ transform:none; }
.priority-chip{
  display:inline-flex; align-items:center; justify-content:center; min-width:30px; height:26px; padding:0 8px;
  border-radius:8px; font-weight:800; font-size:13px;
}
.override-row{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
.override-badge{
  font-size:11px; font-weight:700; padding:3px 8px; border-radius:6px;
  background: color-mix(in srgb, var(--cat-4) 20%, transparent); color:#8a5a00;
}
:root[data-theme="dark"] .override-badge{ color: var(--cat-4); }
.suggested-badge{
  font-size:11px; font-weight:700; padding:3px 8px; border-radius:6px;
  background: color-mix(in srgb, var(--cat-1) 18%, transparent); color:#1a5aa8;
}
:root[data-theme="dark"] .suggested-badge{ color: var(--cat-1); }
.status-badge{
  display:inline-flex; align-items:center; font-size:11px; font-weight:700; padding:4px 9px;
  border-radius:6px; color:#fff; white-space:nowrap;
}
.status-badge.status-na{ background:var(--surface-2); color:var(--text-muted); }
.status-count-row{ display:flex; gap:14px; flex-wrap:wrap; }
.status-count-tile{
  flex:1; min-width:120px; background:var(--surface-2); border-radius:10px; padding:14px;
  display:flex; flex-direction:column; align-items:flex-start; gap:4px;
}
.status-count-dot{ width:10px; height:10px; border-radius:50%; }
.status-count-value{ font-size:22px; font-weight:800; }
.status-count-label{ font-size:12px; color:var(--text-secondary); font-weight:600; }
.target-editor{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
.target-input{
  width:100px; padding:8px 10px; border-radius:8px; border:1px solid var(--border-strong);
  background:var(--surface-1); color:var(--text-primary); font-size:13px;
}
.target-inline-input{
  width:92px; padding:6px 8px; border-radius:7px; border:1px solid var(--border-strong);
  background:var(--surface-1); color:var(--text-primary); font-size:13px;
}
.target-inline-input:disabled{ background:var(--surface-2); color:var(--text-muted); cursor:default; }

.provider-badge{
  display:inline-flex; align-items:center; justify-content:center; flex-shrink:0;
  border-radius:999px; border:1px solid var(--border); box-sizing:border-box;
}
.provider-badge img{ width:100%; height:100%; object-fit:contain; display:block; }

/* ---------- provider view ---------- */
.provider-header-card{ display:flex; align-items:center; justify-content:space-between; gap:20px; flex-wrap:wrap; padding:22px; }
.provider-header-left{ display:flex; align-items:center; gap:16px; }
.provider-title{ font-size:20px; font-weight:800; margin:0; }
.provider-meta{ font-size:13px; color:var(--text-muted); margin-top:2px; }
.provider-priority-block{ text-align:right; }
.provider-priority-block .label{ font-size:11px; color:var(--text-muted); font-weight:700; text-transform:uppercase; margin-bottom:6px; }

/* ---------- certification detail / drawer ---------- */
.overlay{
  position:fixed; inset:0; background:rgba(11,11,11,0.45); z-index:50; display:none;
  align-items:flex-start; justify-content:center; padding:48px 20px; overflow:auto;
}
.overlay.open{ display:flex; }
.drawer{
  background:var(--surface-1); border-radius:16px; max-width:640px; width:100%; box-shadow: var(--shadow);
  padding:0; border:1px solid var(--border);
}
.drawer-head{ display:flex; align-items:flex-start; justify-content:space-between; padding:22px 24px; border-bottom:1px solid var(--border-strong); gap:16px; }
.drawer-title{ font-size:18px; font-weight:800; margin:0 0 4px; }
.drawer-body{ padding:22px 24px; display:flex; flex-direction:column; gap:20px; }
.drawer-close{ border:none; background:var(--surface-2); width:30px;height:30px;border-radius:8px; cursor:pointer; font-size:14px; flex-shrink:0; }
.kv-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:14px; }
.kv-box{ background:var(--surface-2); border-radius:10px; padding:12px 14px; }
.kv-label{ font-size:11px; color:var(--text-muted); font-weight:700; text-transform:uppercase; }
.kv-value{ font-size:18px; font-weight:800; margin-top:4px; }
.desc-text{ font-size:13.5px; line-height:1.6; color:var(--text-secondary); }

footer.app-footer{ margin-top:48px; padding-top:20px; border-top:1px solid var(--border-strong); font-size:12px; color:var(--text-muted); display:flex; justify-content:space-between; flex-wrap:wrap; gap:8px;}

@media (max-width:640px){
  .kv-grid{ grid-template-columns:1fr 1fr; }
  .app-shell{ padding:0 14px 48px; }
  .topbar-inner{ padding:0 14px 16px; }
}
</style>
</head>
