<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prio Certifs — Wavestone</title>
<script id="app-data" type="application/json">/*__APP_DATA__*/</script>
<script id="provider-logos" type="application/json">/*__PROVIDER_LOGOS__*/</script>
<script id="default-logo" type="text/plain">/*__DEFAULT_LOGO__*/</script>
<script id="frozen-flag" type="application/json">false</script>
<script id="frozen-state" type="application/json">null</script>
<style>
:root{
  color-scheme: light;
  --surface-0:#f9f9f7;
  --surface-1:#ffffff;
  --surface-2:#f3f3f0;
  --text-primary:#0b0b0b;
  --text-secondary:#52514e;
  --text-muted:#898781;
  --border:rgba(11,11,11,0.10);
  --border-strong:#e1e0d9;
  --accent:#2a78d6;
  --accent-dark:#184f95;
  --good:#0ca30c;
  --warning:#c98500;
  --serious:#ec835a;
  --critical:#d03b3b;
  --shadow: 0 1px 2px rgba(11,11,11,0.06), 0 4px 16px rgba(11,11,11,0.06);
  --radius: 14px;
  --cat-1:#2a78d6; --cat-2:#eb6834; --cat-3:#1baf7a; --cat-4:#eda100;
  --cat-5:#e87ba4; --cat-6:#008300; --cat-7:#4a3aa7; --cat-8:#e34948;
}
@media (prefers-color-scheme: dark){
  :root:where(:not([data-theme="light"])){
    color-scheme: dark;
    --surface-0:#0d0d0d;
    --surface-1:#1a1a19;
    --surface-2:#232322;
    --text-primary:#ffffff;
    --text-secondary:#c3c2b7;
    --text-muted:#898781;
    --border:rgba(255,255,255,0.10);
    --border-strong:#2c2c2a;
    --accent:#3987e5;
    --accent-dark:#86b6ef;
    --good:#0ca30c;
    --warning:#fab219;
    --serious:#ec835a;
    --critical:#e66767;
    --shadow: 0 1px 2px rgba(0,0,0,0.4), 0 8px 24px rgba(0,0,0,0.35);
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --surface-0:#0d0d0d;
  --surface-1:#1a1a19;
  --surface-2:#232322;
  --text-primary:#ffffff;
  --text-secondary:#c3c2b7;
  --text-muted:#898781;
  --border:rgba(255,255,255,0.10);
  --border-strong:#2c2c2a;
  --accent:#3987e5;
  --accent-dark:#86b6ef;
  --good:#0ca30c;
  --warning:#fab219;
  --serious:#ec835a;
  --critical:#e66767;
  --shadow: 0 1px 2px rgba(0,0,0,0.4), 0 8px 24px rgba(0,0,0,0.35);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  background: var(--surface-0);
  color: var(--text-primary);
  min-height:100vh;
}
button, input, select, textarea{ font-family: inherit; }
.app-shell{ max-width:1280px; margin:0 auto; padding: 0 24px 64px; }

/* ---------- header ---------- */
.topbar{
  position: sticky; top:0; z-index:20;
  background: var(--surface-0);
  border-bottom: 1px solid var(--border-strong);
  padding-top: 20px;
}
.topbar-inner{ max-width:1280px; margin:0 auto; padding: 0 24px 16px; }
.topbar-row{ display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap; }
.brand{ display:flex; align-items:center; gap:10px; }
.brand-mark{
  height:34px; width:auto; flex-shrink:0; display:block;
}
.brand-text h1{ font-size:16px; margin:0; font-weight:700; line-height:1.2;}
.brand-text p{ margin:0; font-size:12px; color:var(--text-muted); }
.top-actions{ display:flex; align-items:center; gap:8px; }
.btn{
  border:1px solid var(--border-strong); background:var(--surface-1); color:var(--text-primary);
  padding:9px 14px;border-radius:10px;font-size:13px;font-weight:600;cursor:pointer;
  display:inline-flex; align-items:center; gap:6px;
}
.btn:hover{ background:var(--surface-2); }
.btn-primary{ background:var(--accent); border-color:var(--accent); color:#fff; }
.btn-primary:hover{ filter:brightness(1.06); }
.btn-ghost{ border-color:transparent; background:transparent; }
.btn-ghost:hover{ background:var(--surface-2); }
.btn-sm{ padding:5px 10px; font-size:12px; border-radius:8px; }
.btn-danger-ghost{ color: var(--critical); border-color:transparent; background:transparent;}
.btn-danger-ghost:hover{ background: color-mix(in srgb, var(--critical) 12%, transparent); }

.mode-banner{
  margin-top:12px; padding:10px 14px; border-radius:10px; font-size:13px;
  display:flex; align-items:center; gap:8px; font-weight:600;
}
.mode-banner.edit{ background: color-mix(in srgb, var(--accent) 10%, transparent); color: var(--accent-dark); }
.mode-banner.frozen{ background: color-mix(in srgb, var(--warning) 16%, transparent); color:#8a5a00; }
:root[data-theme="dark"] .mode-banner.frozen, @media (prefers-color-scheme:dark){ .mode-banner.frozen{ color: var(--warning);} }

.tabs{ display:flex; gap:4px; margin-top:16px; border-bottom:1px solid var(--border-strong); }
.tab{
  padding:10px 6px; margin-bottom:-1px; border:none; background:none; cursor:pointer;
  font-size:14px; font-weight:600; color:var(--text-muted); border-bottom:2px solid transparent;
  display:flex; align-items:center; gap:8px;
}
.tab.active{ color:var(--text-primary); border-bottom-color: var(--accent); }
.tab:hover:not(.active){ color:var(--text-secondary); }

main{ padding-top:24px; }
.view{ display:none; }
.view.active{ display:block; animation: fadein .18s ease; }
@keyframes fadein{ from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:none;} }

h2.section-title{ font-size:15px; font-weight:700; margin: 0 0 12px; }
.section{ margin-bottom:32px; }
.card{
  background:var(--surface-1); border:1px solid var(--border); border-radius:var(--radius);
  box-shadow: var(--shadow);
}
.card-pad{ padding:20px; }

/* ---------- KPI tiles ---------- */
.kpi-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:12px; }
.kpi{ padding:16px 18px; }
.kpi-label{ font-size:12px; color:var(--text-muted); font-weight:600; text-transform:uppercase; letter-spacing:.02em;}
.kpi-value{ font-size:28px; font-weight:700; margin-top:6px; line-height:1.1; }
.kpi-sub{ font-size:12px; color:var(--text-secondary); margin-top:4px; }

/* ---------- dashboard chart ---------- */
.chart-toolbar{ display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; margin-bottom:14px;}
.segmented{ display:inline-flex; border:1px solid var(--border-strong); border-radius:10px; padding:2px; background:var(--surface-2); }
.segmented button{ border:none; background:none; padding:6px 12px; font-size:12px; font-weight:600; border-radius:8px; cursor:pointer; color:var(--text-secondary); }
.segmented button.active{ background:var(--surface-1); color:var(--text-primary); box-shadow: var(--shadow); }
.bars{ display:flex; align-items:flex-end; gap:10px; height:180px; padding-top:20px; }
.bar-col{ flex:1; display:flex; flex-direction:column; align-items:center; gap:8px; height:100%; justify-content:flex-end; }
.bar-count{ font-size:12px; font-weight:700; color:var(--text-secondary); }
.bar-rect{ width:100%; max-width:34px; border-radius:6px 6px 3px 3px; min-height:3px; transition: height .25s ease; }
.bar-label{ font-size:11px; color:var(--text-muted); font-weight:600; }

.two-col{ display:grid; grid-template-columns: 1.3fr 1fr; gap:20px; }
@media (max-width: 860px){ .two-col{ grid-template-columns:1fr; } }

.mini-list{ display:flex; flex-direction:column; gap:10px; }
.mini-row{ display:flex; align-items:center; gap:10px; font-size:13px; }
.mini-row .name{ flex:1; font-weight:600; }
.mini-track{ flex:1.4; height:8px; border-radius:4px; background:var(--surface-2); overflow:hidden; }
.mini-fill{ height:100%; border-radius:4px; }
.mini-val{ width:26px; text-align:right; font-weight:700; font-variant-numeric:tabular-nums; }
.empty-hint{ color:var(--text-muted); font-size:13px; font-style:italic; padding:8px 0; }

/* ---------- provider pills / filters ---------- */
.filter-row{ display:flex; gap:10px; align-items:center; margin-bottom:16px; flex-wrap:wrap; }
.search-input{
  flex:1; min-width:180px; padding:9px 12px; border-radius:10px; border:1px solid var(--border-strong);
  background:var(--surface-1); color:var(--text-primary); font-size:13px;
}
.select-input{
  padding:9px 12px; border-radius:10px; border:1px solid var(--border-strong);
  background:var(--surface-1); color:var(--text-primary); font-size:13px;
}
.pill-row{ display:flex; gap:6px; flex-wrap:wrap; }
.pill{
  padding:6px 12px 6px 6px; border-radius:999px; border:1px solid var(--border-strong); background:var(--surface-1);
  font-size:12px; font-weight:600; cursor:pointer; color:var(--text-secondary); white-space:nowrap;
  display:inline-flex; align-items:center; gap:7px;
}
.pill.active{ background:var(--text-primary); color:var(--surface-1); border-color:var(--text-primary); }

/* ---------- tables ---------- */
table.data-table{ width:100%; border-collapse:collapse; font-size:13px; }
.data-table thead th{
  text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:.03em; color:var(--text-muted);
  font-weight:700; padding:0 12px 10px; border-bottom:1px solid var(--border-strong); cursor:pointer; user-select:none;
  white-space:nowrap;
}
.data-table thead th:hover{ color:var(--text-secondary); }
.data-table tbody td{ padding:12px; border-bottom:1px solid var(--border); vertical-align:middle; }
.data-table tbody tr:hover{ background:var(--surface-2); }
.data-table tbody tr:last-child td{ border-bottom:none; }
.cell-provider{ display:flex; align-items:center; gap:8px; font-weight:700; }
.muted{ color:var(--text-muted); font-style:italic; }
.na{ color:var(--text-muted); }
.num{ font-variant-numeric:tabular-nums; text-align:right; }
.progress-cell{ display:flex; flex-direction:column; gap:4px; min-width:110px; }
.progress-track{ height:6px; background:var(--surface-2); border-radius:3px; overflow:hidden; }
.progress-fill{ height:100%; border-radius:3px; }
.progress-text{ font-size:11px; color:var(--text-secondary); font-variant-numeric:tabular-nums; }
.link-cell{ color:var(--accent); font-weight:700; cursor:pointer; background:none; border:none; padding:0; font-size:13px; text-align:left; }
.link-cell:hover{ text-decoration:underline; }
.diff-badge{ font-size:11px; font-weight:700; padding:3px 8px; border-radius:6px; background:var(--surface-2); color:var(--text-secondary); white-space:nowrap; }

/* ---------- priority picker ---------- */
.priority-picker{ display:inline-flex; gap:3px; }
.priority-dot{
  width:22px;height:22px;border-radius:6px;border:1px solid var(--border-strong);
  font-size:10px; font-weight:700; display:flex; align-items:center; justify-content:center;
  cursor:pointer; background:var(--surface-1); color:var(--text-secondary);
}
.priority-dot:hover{ transform: translateY(-1px); }
.priority-dot.active{ border-color: transparent; }
.priority-picker.readonly .priority-dot{ cursor:default; }
.priority-picker.readonly .priority-dot:hover{ transform:none; }
.priority-chip{
  display:inline-flex; align-items:center; justify-content:center; min-width:30px; height:26px; padding:0 8px;
  border-radius:8px; font-weight:800; font-size:13px;
}
.override-row{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
.override-badge{
  font-size:11px; font-weight:700; padding:3px 8px; border-radius:6px;
  background: color-mix(in srgb, var(--cat-4) 20%, transparent); color:#8a5a00;
}
:root[data-theme="dark"] .override-badge{ color: var(--cat-4); }
.suggested-badge{
  font-size:11px; font-weight:700; padding:3px 8px; border-radius:6px;
  background: color-mix(in srgb, var(--cat-1) 18%, transparent); color:#1a5aa8;
}
:root[data-theme="dark"] .suggested-badge{ color: var(--cat-1); }
.status-badge{
  display:inline-flex; align-items:center; font-size:11px; font-weight:700; padding:4px 9px;
  border-radius:6px; color:#fff; white-space:nowrap;
}
.status-badge.status-na{ background:var(--surface-2); color:var(--text-muted); }
.status-count-row{ display:flex; gap:14px; flex-wrap:wrap; }
.status-count-tile{
  flex:1; min-width:120px; background:var(--surface-2); border-radius:10px; padding:14px;
  display:flex; flex-direction:column; align-items:flex-start; gap:4px;
}
.status-count-dot{ width:10px; height:10px; border-radius:50%; }
.status-count-value{ font-size:22px; font-weight:800; }
.status-count-label{ font-size:12px; color:var(--text-secondary); font-weight:600; }
.target-editor{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
.target-input{
  width:100px; padding:8px 10px; border-radius:8px; border:1px solid var(--border-strong);
  background:var(--surface-1); color:var(--text-primary); font-size:13px;
}
.target-inline-input{
  width:92px; padding:6px 8px; border-radius:7px; border:1px solid var(--border-strong);
  background:var(--surface-1); color:var(--text-primary); font-size:13px;
}
.target-inline-input:disabled{ background:var(--surface-2); color:var(--text-muted); cursor:default; }

.provider-badge{
  display:inline-flex; align-items:center; justify-content:center; flex-shrink:0;
  border-radius:999px; border:1px solid var(--border); box-sizing:border-box;
}
.provider-badge img{ width:100%; height:100%; object-fit:contain; display:block; }

/* ---------- provider view ---------- */
.provider-header-card{ display:flex; align-items:center; justify-content:space-between; gap:20px; flex-wrap:wrap; padding:22px; }
.provider-header-left{ display:flex; align-items:center; gap:16px; }
.provider-title{ font-size:20px; font-weight:800; margin:0; }
.provider-meta{ font-size:13px; color:var(--text-muted); margin-top:2px; }
.provider-priority-block{ text-align:right; }
.provider-priority-block .label{ font-size:11px; color:var(--text-muted); font-weight:700; text-transform:uppercase; margin-bottom:6px; }

/* ---------- certification detail / drawer ---------- */
.overlay{
  position:fixed; inset:0; background:rgba(11,11,11,0.45); z-index:50; display:none;
  align-items:flex-start; justify-content:center; padding:48px 20px; overflow:auto;
}
.overlay.open{ display:flex; }
.drawer{
  background:var(--surface-1); border-radius:16px; max-width:640px; width:100%; box-shadow: var(--shadow);
  padding:0; border:1px solid var(--border);
}
.drawer-head{ display:flex; align-items:flex-start; justify-content:space-between; padding:22px 24px; border-bottom:1px solid var(--border-strong); gap:16px; }
.drawer-title{ font-size:18px; font-weight:800; margin:0 0 4px; }
.drawer-body{ padding:22px 24px; display:flex; flex-direction:column; gap:20px; }
.drawer-close{ border:none; background:var(--surface-2); width:30px;height:30px;border-radius:8px; cursor:pointer; font-size:14px; flex-shrink:0; }
.kv-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:14px; }
.kv-box{ background:var(--surface-2); border-radius:10px; padding:12px 14px; }
.kv-label{ font-size:11px; color:var(--text-muted); font-weight:700; text-transform:uppercase; }
.kv-value{ font-size:18px; font-weight:800; margin-top:4px; }
.desc-text{ font-size:13.5px; line-height:1.6; color:var(--text-secondary); }

footer.app-footer{ margin-top:48px; padding-top:20px; border-top:1px solid var(--border-strong); font-size:12px; color:var(--text-muted); display:flex; justify-content:space-between; flex-wrap:wrap; gap:8px;}

@media (max-width:640px){
  .kv-grid{ grid-template-columns:1fr 1fr; }
  .app-shell{ padding:0 14px 48px; }
  .topbar-inner{ padding:0 14px 16px; }
}
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-inner">
    <div class="topbar-row">
      <div class="brand">
        <img class="brand-mark" src="data:image/png;base64,/*__LOGO_DATA_URI__*/" alt="Wavestone">
        <div class="brand-text">
          <h1>Priorisation des certifications</h1>
          <p>Wavestone — pilotage stratégique par fournisseur</p>
        </div>
      </div>
      <div class="top-actions">
        <button class="btn btn-ghost" id="theme-toggle" title="Changer de thème">Mode sombre</button>
        <button class="btn btn-ghost btn-danger-ghost" id="reset-all-btn" title="Réinitialiser toutes les priorités">Réinitialiser</button>
        <button class="btn btn-ghost" id="export-json-btn" title="Exporter les priorités au format JSON, pour un agent ou un traitement automatisé">Exporter les priorités (JSON)</button>
        <button class="btn btn-primary" id="download-copy-btn">Télécharger une copie à partager</button>
      </div>
    </div>
    <div id="mode-banner"></div>
    <nav class="tabs">
      <button class="tab active" data-view="dashboard">Dashboard</button>
      <button class="tab" data-view="comex">BUST</button>
      <button class="tab" data-view="provider">Providers</button>
      <button class="tab" data-view="certification">Certifications</button>
    </nav>
  </div>
</div>

<div class="app-shell">
<main>

  <section id="view-dashboard" class="view active"></section>
  <section id="view-comex" class="view"></section>
  <section id="view-provider" class="view"></section>
  <section id="view-certification" class="view"></section>

</main>
<footer class="app-footer">
  <span id="footer-left"></span>
  <span>MVP interne — données non synchronisées entre utilisateurs</span>
</footer>
</div>

<div class="overlay" id="cert-overlay">
  <div class="drawer" id="cert-drawer"></div>
</div>

<script>
(function(){
"use strict";

/* ============ bootstrap: data + mode ============ */
var DATA = JSON.parse(document.getElementById('app-data').textContent);
var PROVIDER_LOGOS = JSON.parse(document.getElementById('provider-logos').textContent);
var DEFAULT_LOGO = document.getElementById('default-logo').textContent.trim();
var FROZEN = JSON.parse(document.getElementById('frozen-flag').textContent) === true;
var FROZEN_STATE = JSON.parse(document.getElementById('frozen-state').textContent);
var STORAGE_KEY = 'prioCertifsWavestone_v1';
var THEME_KEY = 'prioCertifsWavestone_theme';

var CATEGORICAL = ['#2a78d6','#eb6834','#1baf7a','#eda100','#e87ba4','#008300','#4a3aa7','#e34948'];
var SEQUENTIAL = ['#cde2fb','#b7d3f6','#9ec5f4','#86b6ef','#6da7ec','#5598e7','#3987e5','#2a78d6','#256abf','#1c5cab','#184f95','#104281','#0d366b'];

function providerColor(provider){
  var idx = 0, hash = 0;
  for (var i=0;i<provider.length;i++){ hash = (hash*31 + provider.charCodeAt(i)) >>> 0; }
  idx = hash % CATEGORICAL.length;
  return CATEGORICAL[idx];
}
function seqColor(level /* 0..10 */){
  var i = Math.round(level*(SEQUENTIAL.length-1)/10);
  return SEQUENTIAL[Math.max(0,Math.min(SEQUENTIAL.length-1,i))];
}
function seqTextColor(level){ return level>=6 ? '#ffffff' : '#0b0b0b'; }

function renderProviderBadge(provider, size, radius){
  radius = radius || '999px';
  var logo = PROVIDER_LOGOS[provider];
  var bg = logo ? '#ffffff' : providerColor(provider);
  var src = logo || DEFAULT_LOGO;
  var pad = Math.round(size * (logo ? 0.16 : 0.24));
  return '<span class="provider-badge" style="width:'+size+'px;height:'+size+'px;border-radius:'+radius+';background:'+bg+';padding:'+pad+'px;">'
    + '<img src="'+src+'" alt="">'
    + '</span>';
}

function loadStoredState(){
  var empty = { providerPriorities:{}, certOverrides:{}, certTargets:{} };
  try{
    var raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) return empty;
    var parsed = JSON.parse(raw);
    return {
      providerPriorities: parsed.providerPriorities || {},
      certOverrides: parsed.certOverrides || {},
      certTargets: parsed.certTargets || {}
    };
  }catch(e){ return empty; }
}
function saveStoredState(){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
  catch(e){ /* storage unavailable: session-only */ }
}

var state = FROZEN ? {
  providerPriorities: (FROZEN_STATE && FROZEN_STATE.providerPriorities) || {},
  certOverrides: (FROZEN_STATE && FROZEN_STATE.certOverrides) || {},
  certTargets: (FROZEN_STATE && FROZEN_STATE.certTargets) || {}
} : loadStoredState();

var FROZEN_EXPORTED_AT = FROZEN && FROZEN_STATE ? FROZEN_STATE.exportedAt : null;

/* ============ priority model ============ */
var DEFAULT_PRIORITY = 5;

function getProviderPriority(provider){
  var v = state.providerPriorities[provider];
  return (v === undefined || v === null) ? DEFAULT_PRIORITY : v;
}
function isProviderTouched(provider){
  return state.providerPriorities[provider] !== undefined;
}
function getCertOverride(certId){
  var v = state.certOverrides[certId];
  return (v === undefined || v === null) ? null : v;
}
function getEffectivePriority(cert){
  var ov = getCertOverride(cert.id);
  if (ov !== null) return ov;
  if (isProviderTouched(cert.provider)) return getProviderPriority(cert.provider);
  var suggested = getSuggestedPriority(cert);
  return suggested !== null ? suggested : DEFAULT_PRIORITY;
}
/* Suggestion automatique (uniquement tant qu'aucune decision manuelle
   n'existe ni sur la certification ni sur le fournisseur) : plus l'objectif
   fixe par le COMEX est ambitieux par rapport a l'objectif global (quota
   source, capacite totale disponible pour cette certification), plus on
   pousse. Ne s'applique que si un objectif global ET un objectif fixe sont
   connus, sinon on retombe sur DEFAULT_PRIORITY. */
function getSuggestedPriority(cert){
  var quota = getBaseTarget(cert);
  var target = getEffectiveTarget(cert);
  if (quota === null || quota <= 0 || target === null) return null;
  var ratio = target / quota;
  if (ratio > 0.90) return 10;
  if (ratio > 0.75) return 9;
  if (ratio > 0.55) return 8;
  if (ratio >= 0.40) return 7;
  if (ratio >= 0.20) return 6;
  return null; // < 20% : pas de suggestion, reste au defaut (5)
}
function isPrioritySuggested(cert){
  return getCertOverride(cert.id) === null && !isProviderTouched(cert.provider) && getSuggestedPriority(cert) !== null;
}
function setProviderPriority(provider, value){
  if (FROZEN) return;
  state.providerPriorities[provider] = value;
  saveStoredState();
  renderAll();
}
function setCertOverride(certId, value){
  if (FROZEN) return;
  state.certOverrides[certId] = value;
  saveStoredState();
  renderAll();
}
function clearCertOverride(certId){
  if (FROZEN) return;
  delete state.certOverrides[certId];
  saveStoredState();
  renderAll();
}
function resetAll(){
  if (FROZEN) return;
  if(!confirm('Réinitialiser toutes les priorités et tous les objectifs (providers et exceptions) ? Cette action est irréversible.')) return;
  state = { providerPriorities:{}, certOverrides:{}, certTargets:{} };
  saveStoredState();
  renderAll();
}

/* ============ objectifs : donnees sources vs decisions COMEX ============
   Sources (lecture seule, jamais modifiables depuis l'interface) :
     objective.obtenu  - nb de certifies actuels
     objective.enCours - nb de personnes en cours de certification (aucune
                         source ne l'alimente encore : reste "Non renseigne"
                         tant qu'un fichier/flux ne le fournit pas)
   Decision COMEX (editable, persistee dans state.certTargets) :
     l'objectif de certifies vise pour une certification. Par defaut, une
     certification n'a pas d'objectif ; les quotas 2026-2027 deja presents
     dans le fichier source servent de valeur de depart, modifiable ou
     supprimable comme n'importe quelle autre certification. */
function getSourceObtenu(cert){ var v = cert.objective.obtenu; return (v===null||v===undefined) ? null : v; }
function getSourceEnCours(cert){ var v = cert.objective.enCours; return (v===null||v===undefined) ? null : v; }
function getBaseTarget(cert){ var v = cert.objective.quota; return (v===null||v===undefined) ? null : v; }

function isTargetOverridden(cert){ return Object.prototype.hasOwnProperty.call(state.certTargets, cert.id); }
function getEffectiveTarget(cert){
  if (isTargetOverridden(cert)) return state.certTargets[cert.id]; // nombre, ou null = "objectif supprime"
  return getBaseTarget(cert);
}
function setCertTarget(certId, value){
  if (FROZEN) return;
  state.certTargets[certId] = value;
  saveStoredState();
  renderAll();
}
function clearCertTarget(certId){
  if (FROZEN) return;
  state.certTargets[certId] = null; // decision explicite : pas d'objectif, meme si une valeur source existe
  saveStoredState();
  renderAll();
}

function getProjection(cert){
  var o = getSourceObtenu(cert), e = getSourceEnCours(cert);
  return (o !== null && e !== null) ? (o + e) : null;
}
function getGap(cert){
  var t = getEffectiveTarget(cert), o = getSourceObtenu(cert);
  return (t !== null && o !== null) ? Math.max(t - o, 0) : null;
}
function getResteAEngager(cert){
  var t = getEffectiveTarget(cert), p = getProjection(cert);
  return (t !== null && p !== null) ? Math.max(t - p, 0) : null;
}
var STATUS_META = {
  atteint:    { label:'Objectif atteint', color:'var(--good)' },
  bonneVoie:  { label:'En bonne voie',     color:'var(--accent)' },
  accelerer:  { label:'À accélérer',       color:'var(--serious)' },
  na:         { label:'Non renseigné',     color:null }
};
function getCertStatus(cert){
  var t = getEffectiveTarget(cert), p = getProjection(cert);
  if (t === null || p === null) return 'na';
  if (Math.max(t - p, 0) <= 0) return 'atteint';
  var ratio = t > 0 ? p / t : 0;
  if (ratio >= 0.6) return 'bonneVoie';
  if (getEffectivePriority(cert) >= 7) return 'accelerer';
  return 'bonneVoie';
}
function renderStatusBadge(cert){
  var key = getCertStatus(cert);
  var meta = STATUS_META[key];
  if (key === 'na') return '<span class="status-badge status-na">'+meta.label+'</span>';
  return '<span class="status-badge" style="background:'+meta.color+';">'+meta.label+'</span>';
}

/* ============ derived data helpers ============ */
function certsByProvider(provider){
  return DATA.certifications.filter(function(c){ return c.provider === provider; });
}
function providerStats(provider){
  var certs = certsByProvider(provider);
  // Objectif global (quota source) : donnee fixe, independante de l'objectif fixe.
  var withQuota = certs.filter(function(c){ return getBaseTarget(c) !== null; });
  var withObtenu = withQuota.filter(function(c){ return getSourceObtenu(c) !== null; });
  // Objectif fixe (decision COMEX, editable) : sert au gap / reste a engager, pas au ratio "certifies".
  var withTarget = certs.filter(function(c){ return getEffectiveTarget(c) !== null; });
  var withTargetObtenu = withTarget.filter(function(c){ return getSourceObtenu(c) !== null; });
  var withEnCours = certs.filter(function(c){ return getSourceEnCours(c) !== null; });
  return {
    certCount: certs.length,
    targetDefinedCount: withTarget.length,
    obtenuKnownCount: withObtenu.length,
    quota: withObtenu.reduce(function(s,c){ return s + getBaseTarget(c); }, 0),
    obtenu: withObtenu.reduce(function(s,c){ return s + getSourceObtenu(c); }, 0),
    gap: withTargetObtenu.reduce(function(s,c){ return s + getGap(c); }, 0),
    enCoursKnownCount: withEnCours.length,
    enCours: withEnCours.reduce(function(s,c){ return s + getSourceEnCours(c); }, 0),
    priority: getProviderPriority(provider),
    touched: isProviderTouched(provider)
  };
}
function fmtNA(n){ return (n === null || n === undefined) ? 'N/A' : n; }
function fmtSortVal(n){ return (n === null || n === undefined) ? -1 : n; }

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}

/* ============ priority picker component ============ */
var pickerSeq = 0;
function renderPriorityPicker(currentValue, onChange, opts){
  opts = opts || {};
  var readonly = FROZEN || opts.readonly;
  var id = 'pk' + (pickerSeq++);
  var html = '<div class="priority-picker' + (readonly?' readonly':'') + '" id="'+id+'">';
  for (var n=0; n<=10; n++){
    var active = n === currentValue;
    var bg = active ? seqColor(n) : '';
    var color = active ? seqTextColor(n) : '';
    html += '<button type="button" class="priority-dot'+(active?' active':'')+'" data-n="'+n+'" '
          + (active ? 'style="background:'+bg+';color:'+color+';"' : '')
          + (readonly ? ' disabled' : '') + '>' + n + '</button>';
  }
  html += '</div>';
  registerPickerHandler(id, onChange, readonly);
  return html;
}
var pendingPickerHandlers = [];
function registerPickerHandler(id, onChange, readonly){
  if (readonly) return;
  pendingPickerHandlers.push({id:id, onChange:onChange});
}
function wirePickerHandlers(){
  pendingPickerHandlers.forEach(function(h){
    var el = document.getElementById(h.id);
    if(!el) return;
    el.querySelectorAll('.priority-dot').forEach(function(btn){
      btn.addEventListener('click', function(){

      });

}

/* ============ cellules objectif / suivi ============ */
function renderProgressCell(cert){
  // Objectif global (quota source, ex: "nombre de certifications disponibles") :
  // donnee fixe, jamais affectee par l'objectif fixe (decision COMEX independante).
  var t = getBaseTarget(cert);
  if (t === null) return '<span class="na">Non renseigné</span>';
  var o = getSourceObtenu(cert);
  if (o === null) return '<span class="na">Non renseigné</span>';
  var pct = t > 0 ? Math.min(100, Math.round(100*o/t)) : 0;
  var gap = Math.max(t - o, 0);
  var color = gap<=0 ? 'var(--good)' : (pct >= 60 ? 'var(--accent)' : (pct >= 25 ? 'var(--warning)' : 'var(--serious)'));
  return '<div class="progress-cell">'
    + '<div class="progress-text">' + o + ' / ' + t + ' certifiés</div>'
    + '<div class="progress-track"><div class="progress-fill" style="width:'+pct+'%;background:'+color+';"></div></div>'
    + '</div>';
}
function renderGapCell(cert){
  var v = getGap(cert);
  if (v === null) return '<span class="na">N/A</span>';
  if (v <= 0) return '<span style="color:var(--good);font-weight:700;">Atteint</span>';
  return '<span style="font-weight:700;">' + v + '</span>';
}
function renderEnCoursCell(cert){
  var v = getSourceEnCours(cert);
  return v === null ? '<span class="na">Non renseigné</span>' : String(v);
}
var targetInputSeq = 0;
var pendingTargetInputs = [];
function renderTargetInlineInput(cert){
  var t = getEffectiveTarget(cert);
  var id = 'ti' + (targetInputSeq++);
  var html = '<input type="number" min="0" step="1" class="target-inline-input" id="'+id+'" placeholder="Non défini" value="'+(t!==null?t:'')+'"'+(FROZEN?' disabled':'')+'>';
  if (isTargetOverridden(cert)) html += ' <span class="override-badge">ajusté</span>';
  if (!FROZEN) pendingTargetInputs.push({ id:id, certId:cert.id });
  return html;
}
function wireTargetInputs(){
  pendingTargetInputs.forEach(function(item){
    var el = document.getElementById(item.id);
    if (!el) return;
    function commit(){
      var cert = DATA.certifications.find(function(x){ return x.id === item.certId; });
      var raw = el.value.trim();
      var newVal = raw === '' ? null : Math.max(0, Math.round(Number(raw)) || 0);
      if (newVal === getEffectiveTarget(cert)) return;
      if (newVal === null) clearCertTarget(item.certId); else setCertTarget(item.certId, newVal);
    }
    el.addEventListener('blur', commit);
    el.addEventListener('keydown', function(e){ if (e.key === 'Enter') el.blur(); });
  });
  pendingTargetInputs = [];
}
function renderResteAEngagerCell(cert){
  var v = getResteAEngager(cert);
  if (v === null) return '<span class="na">Non renseigné</span>';
  if (v <= 0) return '<span style="color:var(--good);font-weight:700;">Atteint</span>';
  return '<span style="font-weight:700;">' + v + '</span>';
}

/* ============ view: DASHBOARD ============ */
var dashboardChartMode = 'certification'; // or 'provider'

function computeDistribution(mode){
  var counts = new Array(11).fill(0);
  if (mode === 'provider'){
    DATA.providers.forEach(function(p){ counts[getProviderPriority(p)]++; });
  } else {
    DATA.certifications.forEach(function(c){ counts[getEffectivePriority(c)]++; });
  }
  return counts;
}

function renderDashboard(){
  var certs = DATA.certifications;
  var withTarget = certs.filter(function(c){ return getEffectiveTarget(c) !== null; });
  var withObtenu = withTarget.filter(function(c){ return getSourceObtenu(c) !== null; });
  var withEnCours = certs.filter(function(c){ return getSourceEnCours(c) !== null; });
  var withProjection = withTarget.filter(function(c){ return getProjection(c) !== null; });
  var quotaTotal = withTarget.reduce(function(s,c){ return s+getEffectiveTarget(c); },0);
  var obtenuTotal = withObtenu.reduce(function(s,c){ return s+getSourceObtenu(c); },0);
  var gapTotal = withObtenu.reduce(function(s,c){ return s+getGap(c); },0);
  var enCoursTotal = withEnCours.reduce(function(s,c){ return s+getSourceEnCours(c); },0);
  var resteAEngagerTotal = withProjection.reduce(function(s,c){ return s+getResteAEngager(c); },0);
  var overrideCount = Object.keys(state.certOverrides).length;
  var touchedProviders = DATA.providers.filter(isProviderTouched).length;

  var kpis = [
    { label:'Fournisseurs', value: DATA.providers.length, sub: touchedProviders + ' priorisés / ' + DATA.providers.length },
    { label:'Certifications', value: certs.length, sub: withTarget.length + ' avec objectif défini' },
    { label:'Certifiés actuels', value: withObtenu.length ? obtenuTotal : 'Non renseigné', sub: 'sur les certifications avec objectif' },
    { label:'En cours', value: withEnCours.length ? enCoursTotal : 'Non renseigné', sub: 'en cours de certification' },
    { label:'Objectif total', value: withTarget.length ? quotaTotal : 'Non renseigné', sub: '2026-2027' },
    { label:'Gap (obtenus)', value: withObtenu.length ? gapTotal : 'Non renseigné', sub: quotaTotal ? Math.round(100*gapTotal/quotaTotal)+'% du quota' : '—' },
    { label:'Reste à engager', value: withProjection.length ? resteAEngagerTotal : 'Non renseigné', sub: 'objectif − projection' },
    { label:'Exceptions', value: overrideCount, sub: 'certifications ajustées individuellement' }
  ];

  var kpiHtml = kpis.map(function(k){
    return '<div class="card kpi"><div class="kpi-label">'+k.label+'</div><div class="kpi-value">'+k.value+'</div><div class="kpi-sub">'+k.sub+'</div></div>';
  }).join('');

  var dist = computeDistribution(dashboardChartMode);
  var maxCount = Math.max.apply(null, dist.concat([1]));
  var barsHtml = dist.map(function(count, level){
    var h = Math.round(140 * count / maxCount);
    return '<div class="bar-col">'
      + '<div class="bar-count">'+ (count||'') +'</div>'
      + '<div class="bar-rect" style="height:'+Math.max(h,count?4:2)+'px;background:'+seqColor(level)+';"></div>'
      + '<div class="bar-label">'+level+'</div>'
      + '</div>';
  }).join('');

  var providerRanking = DATA.providers.map(function(p){
    return { provider:p, priority:getProviderPriority(p) };
  }).sort(function(a,b){ return b.priority - a.priority || a.provider.localeCompare(b.provider); }).slice(0,8);

  var rankingHtml = providerRanking.map(function(r){
    var pct = Math.round(r.priority*10);
    return '<div class="mini-row">'
      + renderProviderBadge(r.provider, 18)
      + '<span class="name">'+escapeHtml(r.provider)+'</span>'
      + '<div class="mini-track"><div class="mini-fill" style="width:'+pct+'%;background:'+seqColor(r.priority)+';"></div></div>'
      + '<span class="mini-val">'+r.priority+'</span>'
      + '</div>';
  }).join('') || '<div class="empty-hint">Aucun fournisseur.</div>';

  var overrides = Object.keys(state.certOverrides).map(function(id){
    var cert = certs.find(function(c){ return c.id === id; });
    return cert ? { cert: cert, value: state.certOverrides[id] } : null;
  }).filter(Boolean).sort(function(a,b){ return b.value - a.value; }).slice(0,8);

  var overridesHtml = overrides.map(function(o){
    return '<div class="mini-row">'
      + '<span class="name">'+escapeHtml(o.cert.name)+' <span class="muted" style="font-style:normal;color:var(--text-muted);">('+escapeHtml(o.cert.provider)+', provider='+getProviderPriority(o.cert.provider)+')</span></span>'
      + '<span class="priority-chip" style="background:'+seqColor(o.value)+';color:'+seqTextColor(o.value)+';">'+o.value+'</span>'
      + '</div>';
  }).join('') || '<div class="empty-hint">Aucune exception saisie pour le moment — toutes les certifications héritent de la priorité de leur fournisseur.</div>';

  var gapRanking = DATA.providers.map(function(p){ return { provider:p, stats: providerStats(p) }; })
    .filter(function(r){ return r.stats.obtenuKnownCount > 0; })
    .sort(function(a,b){ return b.stats.gap - a.stats.gap; }).slice(0,6);
  var maxGap = Math.max.apply(null, gapRanking.map(function(r){return r.stats.gap;}).concat([1]));
  var gapHtml = gapRanking.map(function(r){
    var pct = Math.round(100*r.stats.gap/maxGap);
    return '<div class="mini-row">'
      + renderProviderBadge(r.provider, 18)
      + '<span class="name">'+escapeHtml(r.provider)+'</span>'
      + '<div class="mini-track"><div class="mini-fill" style="width:'+pct+'%;background:var(--serious);"></div></div>'
      + '<span class="mini-val">'+r.stats.gap+'</span>'
      + '</div>';
  }).join('') || '<div class="empty-hint">Pas de données d\'objectif disponibles.</div>';

  var statusCounts = { atteint:0, bonneVoie:0, accelerer:0, na:0 };
  withTarget.forEach(function(c){ statusCounts[getCertStatus(c)]++; });
  var statusHtml = ['atteint','bonneVoie','accelerer','na'].map(function(key){
    var meta = STATUS_META[key];
    var color = key==='na' ? 'var(--text-muted)' : meta.color;
    return '<div class="status-count-tile">'
      + '<div class="status-count-dot" style="background:'+color+';"></div>'
      + '<div class="status-count-value">'+statusCounts[key]+'</div>'
      + '<div class="status-count-label">'+meta.label+'</div>'
      + '</div>';
  }).join('');

  var missingData = withTarget.filter(function(c){
    return getSourceObtenu(c) === null || getSourceEnCours(c) === null;
  }).sort(function(a,b){ return getEffectivePriority(b)-getEffectivePriority(a); }).slice(0,8);
  var missingDataHtml = missingData.map(function(c){
    var missing = [];
    if (getSourceObtenu(c) === null) missing.push('certifiés');
    if (getSourceEnCours(c) === null) missing.push('en cours');
    return '<div class="mini-row">'
      + renderProviderBadge(c.provider, 18)
      + '<span class="name">'+escapeHtml(c.name)+' <span class="muted" style="font-style:normal;color:var(--text-muted);">('+escapeHtml(c.provider)+')</span></span>'
      + '<span class="muted" style="font-style:normal;font-size:11px;">'+missing.join(', ')+' non renseigné(s)</span>'
      + '</div>';
  }).join('') || '<div class="empty-hint">Aucune certification avec objectif n\'a de donnée manquante.</div>';

  document.getElementById('view-dashboard').innerHTML =
    '<div class="section"><div class="kpi-grid">'+kpiHtml+'</div></div>'
  + '<div class="section card card-pad">'
    + '<div class="chart-toolbar">'
      + '<h2 class="section-title" style="margin:0;">Répartition des priorités</h2>'
      + '<div class="segmented" id="dist-toggle">'
        + '<button data-mode="certification" class="'+(dashboardChartMode==='certification'?'active':'')+'">Par certification</button>'
        + '<button data-mode="provider" class="'+(dashboardChartMode==='provider'?'active':'')+'">Par fournisseur</button>'
      + '</div>'
    + '</div>'
    + '<div class="bars">'+barsHtml+'</div>'
  + '</div>'
  + '<div class="section two-col">'
    + '<div class="card card-pad">'
      + '<h2 class="section-title">Priorités fournisseurs les plus fortes</h2>'
      + '<div class="mini-list">'+rankingHtml+'</div>'
    + '</div>'
    + '<div class="card card-pad">'
      + '<h2 class="section-title">Fournisseurs avec le plus grand gap restant</h2>'
      + '<div class="mini-list">'+gapHtml+'</div>'
    + '</div>'
  + '</div>'
  + '<div class="section card card-pad">'
    + '<h2 class="section-title">Statuts des objectifs</h2>'
    + '<p style="font-size:13px;color:var(--text-secondary);margin-top:-4px;">Calculés sur la projection (certifiés + en cours) — restent « Non renseigné » tant que le nombre de personnes en cours de certification n\'est pas disponible.</p>'
    + '<div class="status-count-row">'+statusHtml+'</div>'
  + '</div>'
  + '<div class="section two-col">'
    + '<div class="card card-pad">'
      + '<h2 class="section-title">Exceptions individuelles (priorité ≠ priorité du fournisseur)</h2>'
      + '<div class="mini-list">'+overridesHtml+'</div>'
    + '</div>'
    + '<div class="card card-pad">'
      + '<h2 class="section-title">Certifications avec un objectif mais des données manquantes</h2>'
      + '<div class="mini-list">'+missingDataHtml+'</div>'
    + '</div>'
  + '</div>';

  var toggle = document.getElementById('dist-toggle');
  toggle.querySelectorAll('button').forEach(function(btn){
    btn.addEventListener('click', function(){
      dashboardChartMode = btn.getAttribute('data-mode');
      renderDashboard();
    });
  });
}

/* ============ view: COMEX ============ */
var comexSort = { key:'priority', dir:-1 };
function renderComex(){
  var rows = DATA.providers.map(function(p){ return { provider:p, stats: providerStats(p) }; });
  rows.sort(function(a,b){
    var k = comexSort.key, dir = comexSort.dir;
    var av, bv;
    if (k === 'provider'){ av=a.provider; bv=b.provider; return dir*av.localeCompare(bv); }
    if (k === 'certCount'){ av=a.stats.certCount; bv=b.stats.certCount; }
    else if (k === 'obtenu'){ av=a.stats.obtenu; bv=b.stats.obtenu; }
    else if (k === 'enCours'){ av=a.stats.enCours; bv=b.stats.enCours; }
    else { av=a.stats.priority; bv=b.stats.priority; }
    return dir*(av-bv);
  });

  var header = ['provider:Fournisseur','certCount:Nb certifications','obtenu:Nb certifiés','enCours:En cours','priority:Priorité']
    .map(function(spec){
      var parts = spec.split(':'); var key=parts[0], label=parts[1];
      var arrow = comexSort.key===key ? (comexSort.dir===1?' ▲':' ▼') : '';
      return '<th data-key="'+key+'">'+label+arrow+'</th>';
    }).join('');

  var body = rows.map(function(r){
    var s = r.stats;
    var hasObtenu = s.obtenuKnownCount > 0;
    var partial = hasObtenu && s.obtenuKnownCount < s.certCount;
    return '<tr>'
      + '<td><button class="link-cell" data-provider="'+escapeHtml(r.provider)+'"><span class="cell-provider">'+renderProviderBadge(r.provider, 20)+escapeHtml(r.provider)+'</span></button></td>'
      + '<td class="num">'+s.certCount+'</td>'
      + '<td class="num">'+(hasObtenu ? s.obtenu + (partial?' <span class="muted" style="font-size:11px;">('+s.obtenuKnownCount+'/'+s.certCount+' renseignées)</span>':'') : '<span class="na">Non renseigné</span>')+'</td>'
      + '<td class="num">'+(s.enCoursKnownCount ? s.enCours : '<span class="na">Non renseigné</span>')+'</td>'
      + '<td>'+renderPriorityPicker(s.priority, function(provider){ return function(v){ setProviderPriority(provider, v); }; }(r.provider))+'</td>'
      + '</tr>';
  }).join('');

  document.getElementById('view-comex').innerHTML =
    '<div class="card card-pad">'
    + '<h2 class="section-title">Priorisation par fournisseur</h2>'
    + '<p style="font-size:13px;color:var(--text-secondary);margin-top:-4px;">Définissez la priorité de chaque fournisseur (0 = non prioritaire, 10 = priorité maximale). Elle s\'applique automatiquement à toutes ses certifications, sauf exception définie en vue Certification.</p>'
    + '<div style="overflow-x:auto;"><table class="data-table"><thead><tr>'+header+'</tr></thead><tbody>'+body+'</tbody></table></div>'
    + '</div>';

  document.querySelectorAll('#view-comex thead th').forEach(function(th){
    th.addEventListener('click', function(){
      var key = th.getAttribute('data-key');
      if (comexSort.key === key) comexSort.dir *= -1; else { comexSort.key = key; comexSort.dir = -1; }
      renderComex();
    });
  });
  document.querySelectorAll('#view-comex .link-cell').forEach(function(btn){
    btn.addEventListener('click', function(){
      selectedProvider = btn.getAttribute('data-provider');
      switchView('provider');
    });
  });
  wirePickerHandlers();
}

var providerSort = { key:'name', dir:1 };

function renderProviderPills(){

var providerViewFilter = 'all'; // 'all' | 'withTarget'

function renderProvider(){
  if (!selectedProvider) selectedProvider = DATA.providers[0];
  var p = selectedProvider;
  var s = providerStats(p);
  var certs = certsByProvider(p).slice();

  if (providerViewFilter === 'withTarget'){
    certs = certs.filter(function(c){ return getEffectiveTarget(c) !== null; });
  }

  providerSort = providerSort || {key:'name',dir:1};
  certs.sort(function(a,b){
    var k = providerSort.key, dir = providerSort.dir;
    if (k==='name') return dir*a.name.localeCompare(b.name);
    if (k==='priority') return dir*(getEffectivePriority(a)-getEffectivePriority(b));
    if (k==='obtenu') return dir*(fmtSortVal(getSourceObtenu(a))-fmtSortVal(getSourceObtenu(b)));
    if (k==='enCours') return dir*(fmtSortVal(getSourceEnCours(a))-fmtSortVal(getSourceEnCours(b)));
    if (k==='target') return dir*(fmtSortVal(getEffectiveTarget(a))-fmtSortVal(getEffectiveTarget(b)));
    if (k==='reste') return dir*(fmtSortVal(getResteAEngager(a))-fmtSortVal(getResteAEngager(b)));
    return 0;
  });

  var header = ['name:Certification','level:Niveau','obtenu:Certifiés','enCours:En cours','target:Objectif fixé','reste:Reste à engager','priority:Priorité']
    .map(function(spec){
      var parts = spec.split(':'); var key=parts[0], label=parts[1];
      if (key === 'level') return '<th style="cursor:default;">'+label+'</th>';
      var arrow = providerSort.key===key ? (providerSort.dir===1?' ▲':' ▼') : '';
      return '<th data-key="'+key+'">'+label+arrow+'</th>';
    }).join('');

  var rows = certs.map(function(c){
    var eff = getEffectivePriority(c);
    var overridden = getCertOverride(c.id) !== null;
    return '<tr>'
      + '<td><button class="link-cell" data-cert="'+c.id+'">'+escapeHtml(c.name)+'</button>'
        + (overridden ? ' <span class="override-badge">ajustée</span>' : '') + '</td>'
      + '<td>'+ (c.difficulty ? '<span class="diff-badge">'+escapeHtml(c.difficulty)+'</span>' : '<span class="na">N/A</span>') +'</td>'
      + '<td>'+ renderProgressCell(c) +'</td>'
      + '<td>'+ renderEnCoursCell(c) +'</td>'
      + '<td>'+ renderTargetInlineInput(c) +'</td>'
      + '<td>'+ renderResteAEngagerCell(c) +'</td>'
      + '<td>'+ renderPriorityPicker(eff, function(certId){ return function(v){ setCertOverride(certId, v); }; }(c.id))
        + (isPrioritySuggested(c) ? ' <span class="suggested-badge">suggérée</span>' : '') + '</td>'
      + '</tr>';
  }).join('') || '<tr><td colspan="7"><div class="empty-hint">Aucune certification ne correspond à ce filtre.</div></td></tr>';

  document.getElementById('view-provider').innerHTML =
    '<div class="section pill-row">'+renderProviderPills()+'</div>'
  + '<div class="section card provider-header-card">'
    + '<div class="provider-header-left">'
      + renderProviderBadge(p, 52, '14px')
      + '<div><h2 class="provider-title">'+escapeHtml(p)+'</h2>'
      + '<div class="provider-meta">'+s.certCount+' certification(s)'+(s.obtenuKnownCount?' · '+s.obtenu+'/'+s.quota+' certifiés':' · certifiés non renseignés')+' · '+s.targetDefinedCount+' objectif(s) défini(s)</div></div>'
    + '</div>'
    + '<div class="provider-priority-block">'
      + '<div class="label">Priorité du fournisseur</div>'
      + renderPriorityPicker(s.priority, function(v){ setProviderPriority(p, v); })
    + '</div>'
  + '</div>'
  + '<div class="section card card-pad">'
    + '<h2 class="section-title">Certifications '+escapeHtml(p)+'</h2>'
    + '<p style="font-size:13px;color:var(--text-secondary);margin-top:-4px;">Chaque certification hérite de la priorité du fournisseur ('+s.priority+'). Cliquez sur un autre niveau pour créer une exception individuelle, ou sur une certification pour définir un objectif.</p>'
    + '<div class="segmented" id="provider-view-filter" style="margin-bottom:14px;">'
      + '<button data-filter="all" class="'+(providerViewFilter==='all'?'active':'')+'">Toutes</button>'
      + '<button data-filter="withTarget" class="'+(providerViewFilter==='withTarget'?'active':'')+'">Avec objectif défini</button>'
    + '</div>'
    + '<div style="overflow-x:auto;"><table class="data-table"><thead><tr>'+header+'</tr></thead><tbody>'+rows+'</tbody></table></div>'
  + '</div>';

  document.querySelectorAll('#view-provider .pill').forEach(function(btn){
    btn.addEventListener('click', function(){ selectedProvider = btn.getAttribute('data-provider'); renderProvider(); });
  });
  document.getElementById('provider-view-filter').querySelectorAll('button').forEach(function(btn){
    btn.addEventListener('click', function(){ providerViewFilter = btn.getAttribute('data-filter'); renderProvider(); });
  });
  document.querySelectorAll('#view-provider thead th[data-key]').forEach(function(th){
    th.addEventListener('click', function(){
      var key = th.getAttribute('data-key');
      if (providerSort.key === key) providerSort.dir *= -1; else { providerSort.key = key; providerSort.dir = 1; }
      renderProvider();
    });
  });
  document.querySelectorAll('#view-provider .link-cell').forEach(function(btn){
    btn.addEventListener('click', function(){ openCertDrawer(btn.getAttribute('data-cert')); });
  });
  wirePickerHandlers();
  wireTargetInputs();
}

/* ============ view: CERTIFICATION ============ */
var certFilter = { search:'', provider:'ALL', difficulty:'ALL' };
var certSort = { key:'name', dir:1 };

function renderCertification(){
  var difficulties = Array.from(new Set(DATA.certifications.map(function(c){ return c.difficulty; }).filter(Boolean)));

  var list = DATA.certifications.filter(function(c){
    if (certFilter.provider !== 'ALL' && c.provider !== certFilter.provider) return false;
    if (certFilter.difficulty !== 'ALL' && c.difficulty !== certFilter.difficulty) return false;
    if (certFilter.search){
      var q = certFilter.search.toLowerCase();
      if (c.name.toLowerCase().indexOf(q) === -1 && c.provider.toLowerCase().indexOf(q) === -1) return false;
    }
    return true;
  });

  list.sort(function(a,b){
    var k = certSort.key, dir = certSort.dir;
    if (k==='name') return dir*a.name.localeCompare(b.name);
    if (k==='provider') return dir*a.provider.localeCompare(b.provider);
    if (k==='priority') return dir*(getEffectivePriority(a)-getEffectivePriority(b));
    if (k==='obtenu') return dir*(fmtSortVal(getSourceObtenu(a))-fmtSortVal(getSourceObtenu(b)));
    if (k==='enCours') return dir*(fmtSortVal(getSourceEnCours(a))-fmtSortVal(getSourceEnCours(b)));
    if (k==='target') return dir*(fmtSortVal(getEffectiveTarget(a))-fmtSortVal(getEffectiveTarget(b)));
    return 0;
  });

  var header = ['name:Certification','provider:Fournisseur','difficulty:Difficulté','obtenu:Certifiés','enCours:En cours','target:Objectif fixé','status:Statut','priority:Priorité']
    .map(function(spec){
      var parts = spec.split(':'); var key=parts[0], label=parts[1];
      var arrow = certSort.key===key ? (certSort.dir===1?' ▲':' ▼') : '';
      var sortable = key !== 'difficulty' && key !== 'status';
      return '<th'+(sortable?' data-key="'+key+'"':' style="cursor:default;"')+'>'+label+(sortable?arrow:'')+'</th>';
    }).join('');

  var rows = list.map(function(c){
    var eff = getEffectivePriority(c);
    var overridden = getCertOverride(c.id) !== null;
    return '<tr>'
      + '<td><button class="link-cell" data-cert="'+c.id+'">'+escapeHtml(c.name)+'</button>'
        + (overridden ? ' <span class="override-badge">ajustée</span>' : '') + '</td>'
      + '<td><span class="cell-provider" style="font-weight:600;">'+renderProviderBadge(c.provider, 20)+escapeHtml(c.provider)+'</span></td>'
      + '<td>'+ (c.difficulty ? '<span class="diff-badge">'+escapeHtml(c.difficulty)+'</span>' : '<span class="na">N/A</span>') +'</td>'
      + '<td>'+ renderProgressCell(c) +'</td>'
      + '<td>'+ renderEnCoursCell(c) +'</td>'
      + '<td>'+ renderTargetInlineInput(c) +'</td>'
      + '<td>'+ renderStatusBadge(c) +'</td>'
      + '<td>'+ renderPriorityPicker(eff, function(certId){ return function(v){ setCertOverride(certId, v); }; }(c.id))
        + (isPrioritySuggested(c) ? ' <span class="suggested-badge">suggérée</span>' : '') + '</td>'
      + '</tr>';
  }).join('') || '<tr><td colspan="8"><div class="empty-hint">Aucune certification ne correspond aux filtres.</div></td></tr>';

  var providerOptions = '<option value="ALL">Tous les fournisseurs</option>' + DATA.providers.map(function(p){
    return '<option value="'+escapeHtml(p)+'"'+(certFilter.provider===p?' selected':'')+'>'+escapeHtml(p)+'</option>';
  }).join('');
  var difficultyOptions = '<option value="ALL">Toutes difficultés</option>' + difficulties.map(function(d){
    return '<option value="'+escapeHtml(d)+'"'+(certFilter.difficulty===d?' selected':'')+'>'+escapeHtml(d)+'</option>';
  }).join('');

  document.getElementById('view-certification').innerHTML =
    '<div class="card card-pad">'
    + '<h2 class="section-title">Vue Certification — recherche et ajustement fin</h2>'
    + '<div class="filter-row">'
      + '<input type="text" class="search-input" id="cert-search" placeholder="Rechercher une certification ou un fournisseur…" value="'+escapeHtml(certFilter.search)+'">'
      + '<select class="select-input" id="cert-filter-provider">'+providerOptions+'</select>'
      + '<select class="select-input" id="cert-filter-difficulty">'+difficultyOptions+'</select>'
    + '</div>'
    + '<div style="font-size:12px;color:var(--text-muted);margin-bottom:10px;">'+list.length+' certification(s) affichée(s) sur '+DATA.certifications.length+'</div>'
    + '<div style="overflow-x:auto;"><table class="data-table"><thead><tr>'+header+'</tr></thead><tbody>'+rows+'</tbody></table></div>'
    + '</div>';

  document.getElementById('cert-search').addEventListener('input', function(e){ certFilter.search = e.target.value; renderCertification(); });
  document.getElementById('cert-filter-provider').addEventListener('change', function(e){ certFilter.provider = e.target.value; renderCertification(); });
  document.getElementById('cert-filter-difficulty').addEventListener('change', function(e){ certFilter.difficulty = e.target.value; renderCertification(); });
  document.querySelectorAll('#view-certification thead th[data-key]').forEach(function(th){
    th.addEventListener('click', function(){
      var key = th.getAttribute('data-key');
      if (certSort.key === key) certSort.dir *= -1; else { certSort.key = key; certSort.dir = 1; }
      renderCertification();
    });
  });
  document.querySelectorAll('#view-certification .link-cell').forEach(function(btn){
    btn.addEventListener('click', function(){ openCertDrawer(btn.getAttribute('data-cert')); });
  });
  wirePickerHandlers();
  wireTargetInputs();
}

/* ============ certification detail drawer ============ */
function openCertDrawer(certId){
  var c = DATA.certifications.find(function(x){ return x.id === certId; });
  if (!c) return;
  var eff = getEffectivePriority(c);
  var overridden = getCertOverride(c.id) !== null;
  var providerPrio = getProviderPriority(c.provider);

  var overrideControls = FROZEN ? '' :
    '<div style="display:flex;gap:8px;align-items:center;">'
    + (overridden ? '<button class="btn btn-sm" id="drawer-clear-override">Revenir à la priorité du fournisseur ('+providerPrio+')</button>' : '')
    + '</div>';

  var obtenu = getSourceObtenu(c), enCours = getSourceEnCours(c);
  var target = getEffectiveTarget(c), reste = getResteAEngager(c);
  var targetOverridden = isTargetOverridden(c);
  var baseTarget = getBaseTarget(c);

  var targetHint = '';
  if (!FROZEN && baseTarget !== null && (targetOverridden ? state.certTargets[c.id] !== baseTarget : false)){
    targetHint = '<div class="kv-label" style="margin-top:6px;font-weight:400;font-style:italic;">Valeur source (2026-2027) : '+baseTarget+'</div>';
  }
  var targetEditor = FROZEN ? '' :
    '<div class="target-editor">'
    + '<input type="number" min="0" step="1" class="target-input" id="target-input" placeholder="Non défini" value="'+(target!==null?target:'')+'">'
    + '<button class="btn btn-sm" id="target-save-btn">Enregistrer</button>'
    + (target!==null ? '<button class="btn btn-sm btn-danger-ghost" id="target-clear-btn">Supprimer l\'objectif</button>' : '')
    + '</div>'
    + targetHint;

  document.getElementById('cert-drawer').innerHTML =
    '<div class="drawer-head">'
      + '<div><div class="drawer-title">'+escapeHtml(c.name)+'</div>'
      + '<div class="cell-provider" style="font-size:13px;">'+renderProviderBadge(c.provider, 20)+escapeHtml(c.provider)
        + (c.difficulty ? ' · <span class="diff-badge">'+escapeHtml(c.difficulty)+'</span>' : '') + '</div></div>'
      + '<button class="drawer-close" id="drawer-close">&times;</button>'
    + '</div>'
    + '<div class="drawer-body">'
      + '<div class="kv-grid">'
        + '<div class="kv-box"><div class="kv-label">Certifiés</div><div class="kv-value">'+(obtenu!==null?obtenu:'N/A')+'</div></div>'
        + '<div class="kv-box"><div class="kv-label">En cours</div><div class="kv-value">'+(enCours!==null?enCours:'N/A')+'</div></div>'
        + '<div class="kv-box"><div class="kv-label">Objectif fixé</div><div class="kv-value">'+(target!==null?target:'N/A')+'</div></div>'
        + '<div class="kv-box"><div class="kv-label">Reste à engager</div><div class="kv-value">'+(reste!==null?(reste<=0?'Atteint':reste):'N/A')+'</div></div>'
        + '<div class="kv-box"><div class="kv-label">Statut</div><div class="kv-value" style="font-size:14px;">'+renderStatusBadge(c)+'</div></div>'
      + '</div>'
      + '<div><div class="kv-label" style="margin-bottom:8px;">Description</div><div class="desc-text">'+escapeHtml(c.description || 'Non renseigné')+'</div></div>'
      + '<div class="kv-label">Coût : <span class="na" style="text-transform:none;font-weight:400;">Non renseigné</span></div>'
      + '<div>'
        + '<div class="kv-label" style="margin-bottom:8px;">Objectif fixé (optionnel)</div>'
        + targetEditor
      + '</div>'
      + '<div>'
        + '<div class="kv-label" style="margin-bottom:8px;">Priorité effective'+(overridden?' <span class="override-badge">ajustée individuellement</span>':(isPrioritySuggested(c)?' <span class="suggested-badge">suggérée selon l\'avancement</span>':' (héritée du fournisseur)'))+'</div>'
        + '<div class="override-row">' + renderPriorityPicker(eff, function(v){ setCertOverride(c.id, v); openCertDrawer(c.id); }) + '</div>'
        + '<div style="margin-top:10px;">'+overrideControls+'</div>'
      + '</div>'
    + '</div>';

  document.getElementById('cert-overlay').classList.add('open');
  document.getElementById('drawer-close').addEventListener('click', closeCertDrawer);
  if (!FROZEN && overridden){
    var clearBtn = document.getElementById('drawer-clear-override');
    if (clearBtn) clearBtn.addEventListener('click', function(){ clearCertOverride(c.id); openCertDrawer(c.id); });
  }
  if (!FROZEN){
    document.getElementById('target-save-btn').addEventListener('click', function(){
      var raw = document.getElementById('target-input').value;
      if (raw === '') { clearCertTarget(c.id); }
      else { setCertTarget(c.id, Math.max(0, Math.round(Number(raw)) || 0)); }
      openCertDrawer(c.id);
    });
    var targetClearBtn = document.getElementById('target-clear-btn');
    if (targetClearBtn) targetClearBtn.addEventListener('click', function(){ clearCertTarget(c.id); openCertDrawer(c.id); });
  }
  wirePickerHandlers();
}
function closeCertDrawer(){ document.getElementById('cert-overlay').classList.remove('open'); }
document.getElementById('cert-overlay').addEventListener('click', function(e){
  if (e.target.id === 'cert-overlay') closeCertDrawer();
});

/* ============ navigation ============ */
function switchView(name){
  document.querySelectorAll('.view').forEach(function(v){ v.classList.remove('active'); });
  document.querySelectorAll('.tab').forEach(function(t){ t.classList.remove('active'); });
  document.getElementById('view-'+name).classList.add('active');
  document.querySelector('.tab[data-view="'+name+'"]').classList.add('active');
  renderCurrentView(name);
}
function renderCurrentView(name){
  if (name === 'dashboard') renderDashboard();
  else if (name === 'comex') renderComex();
  else if (name === 'provider') renderProvider();
  else if (name === 'certification') renderCertification();
}
function currentActiveView(){
  var el = document.querySelector('.view.active');
  return el ? el.id.replace('view-','') : 'dashboard';
}
function renderAll(){ renderCurrentView(currentActiveView()); }

document.querySelectorAll('.tab').forEach(function(t){
  t.addEventListener('click', function(){ switchView(t.getAttribute('data-view')); });
});

/* ============ mode banner / header setup ============ */
function setupModeBanner(){
  var el = document.getElementById('mode-banner');
  if (FROZEN){
    var dateStr = FROZEN_EXPORTED_AT ? new Date(FROZEN_EXPORTED_AT).toLocaleDateString('fr-FR', {day:'numeric',month:'long',year:'numeric'}) : 'date inconnue';
    el.innerHTML = '<div class="mode-banner frozen">Mode consultation — copie partagée le '+dateStr+'. Les priorités affichées sont figées ; toute modification que vous feriez ici reste locale à votre navigateur et n\'est pas renvoyée à l\'auteur.</div>';
    document.getElementById('download-copy-btn').style.display = 'none';
    document.getElementById('reset-all-btn').style.display = 'none';
    document.getElementById('export-json-btn').style.display = 'none';
  } else {
    el.innerHTML = '<div class="mode-banner edit">Mode édition — vos priorités sont enregistrées automatiquement dans ce navigateur (localStorage).</div>';
  }
}

/* ============ theme toggle ============ */
function applyTheme(t){
  if (t) document.documentElement.setAttribute('data-theme', t);
  else document.documentElement.removeAttribute('data-theme');
  document.getElementById('theme-toggle').textContent = (t==='dark') ? 'Mode clair' : 'Mode sombre';
}
(function initTheme(){
  var saved = null;
  try{ saved = localStorage.getItem(THEME_KEY); }catch(e){}
  applyTheme(saved);
})();
document.getElementById('theme-toggle').addEventListener('click', function(){
  var current = document.documentElement.getAttribute('data-theme');
  var next = current === 'dark' ? 'light' : 'dark';
  applyTheme(next);
  try{ localStorage.setItem(THEME_KEY, next); }catch(e){}
});

/* ============ reset all ============ */
document.getElementById('reset-all-btn').addEventListener('click', resetAll);

/* ============ export priorities as JSON (for an agent / automated processing) ============ */
document.getElementById('export-json-btn').addEventListener('click', function(){
  var payload = {
    source: 'Prio Certifs - Wavestone',
    exportedAt: new Date().toISOString(),
    providers: DATA.providers.map(function(p){
      return { provider: p, priority: getProviderPriority(p) };
    }),
    certifications: DATA.certifications.map(function(c){
      return {
        id: c.id,
        name: c.name,
        provider: c.provider,
        difficulty: c.difficulty,
        description: c.description,
        certifiedCount: getSourceObtenu(c),
        inProgressCount: getSourceEnCours(c),
        projectedCount: getProjection(c),
        targetCount: getEffectiveTarget(c),
        targetOverridden: isTargetOverridden(c),
        remainingToLaunch: getResteAEngager(c),
        status: getCertStatus(c),
        priority: getEffectivePriority(c),
        priorityOverridden: getCertOverride(c.id) !== null,
        prioritySuggested: isPrioritySuggested(c)
      };
    })
  };
  var json = JSON.stringify(payload, null, 2);
  var blob = new Blob([json], { type: 'application/json;charset=utf-8' });
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  var stamp = new Date().toISOString().slice(0,10);
  a.href = url;
  a.download = 'prio-certifs-wavestone-export-' + stamp + '.json';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(function(){ URL.revokeObjectURL(url); }, 4000);
});

/* ============ share / download frozen copy ============ */
document.getElementById('download-copy-btn').addEventListener('click', function(){
  var snapshot = {
    providerPriorities: state.providerPriorities,
    certOverrides: state.certOverrides,
    certTargets: state.certTargets,
    exportedAt: new Date().toISOString()
  };
  var clone = document.documentElement.cloneNode(true);
  var flagEl = clone.querySelector('#frozen-flag');
  var stateEl = clone.querySelector('#frozen-state');
  flagEl.textContent = 'true';
  stateEl.textContent = JSON.stringify(snapshot).replace(/<\/script/gi, '<\\/script');
  var html = '<!DOCTYPE html>\n' + clone.outerHTML;
  var blob = new Blob([html], { type: 'text/html;charset=utf-8' });
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  var stamp = new Date().toISOString().slice(0,10);
  a.href = url;
  a.download = 'prio-certifs-wavestone-partage-' + stamp + '.html';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(function(){ URL.revokeObjectURL(url); }, 4000);
});

/* ============ footer ============ */
document.getElementById('footer-left').textContent = 'Catalogue : ' + DATA.certifications.length + ' certifications · ' + DATA.providers.length + ' fournisseurs';

/* ============ init ============ */
setupModeBanner();
switchView('dashboard');

})();
</script>
